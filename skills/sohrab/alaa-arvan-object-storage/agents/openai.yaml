interface:
  display_name: "Alaa ArvanCloud Object Storage"
  short_description: "Arvan S3 deltas over the MinIO baseline"
  default_prompt: "Use $alaa-arvan-object-storage only for what ArvanCloud Object Storage does differently from S3 and MinIO. Read $alaa-minio-object-storage first and apply its nine constraints as the baseline; everything shared lives there and is not repeated here, including the STORAGE_* environment family, whose Arvan-only differences are in references/15-environment-contract-deltas.md and whose names are used here unchanged. Pin the regional endpoint host and region identifier in configuration and let no client fall back to a default region, because a bucket is reachable only at its own region's endpoint and the wrong region returns a not-found identical to a deleted object. Treat the region and bucket name as permanent once the bucket exists. Set STORAGE_MAX_PART_SIZE_BYTES to 400000000 and STORAGE_MAX_OBJECT_BYTES to 4000000000000, which is stricter than the 5 GB part and 5 TB object an AWS or MinIO guide will suggest; Arvan's published 5 TB, 400 MB and 10,000-part figures conflict, and where published numbers conflict the default is the minimum, so the effective ceiling is 400,000,000 x 10,000 = 4 TB. Send any payload above 5 GB as multipart. Abort a failed multipart upload from the client as well as from the lifecycle rule, because AbortIncompleteMultipartUpload is absent from the Arvan lifecycle page that documents Expiration and abandoned parts are billed. Apply an Arvan lifecycle rule through the S3 API and expect no lifecycle control in the panel. Treat every Arvan access key as account-wide and separate services by account or bucket policy rather than key scope. Re-check previously public objects after switching a bucket private, and purge the Arvan CDN when a public object is deleted or overwritten. Set STORAGE_USE_PATH_STYLE to false so buckets are addressed virtual-hosted, and set STORAGE_SIGNATURE_VERSION to s3v4, which is this skill's default rather than a provider guarantee because Arvan states no signature requirement and its own SDK examples set none. Check references/20-s3-compatibility-matrix.md before calling any S3 operation, and prove any row that is not Supported against a scratch bucket. Run scripts/check_arvan_storage_config.py --root <repo> and treat any finding as blocking. Cite every provider claim with its read date, re-read a fact older than 90 days, and answer an open question in references/SOURCES.md rather than assuming the AWS or MinIO behaviour."

policy:
  allow_implicit_invocation: true
