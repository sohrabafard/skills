workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  image: alpine:3.20
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - apk add --no-cache bash git

stages:
  - lint
  - test
  - build

cache:
  key: ${CI_PROJECT_PATH_SLUG}-${CI_DEFAULT_BRANCH}
  paths:
    - .cache/

lint:
  stage: lint
  script:
    - echo "replace with your real lint command"

unit-test:
  stage: test
  needs:
    - lint
  script:
    - echo "replace with your real test command"

build:
  stage: build
  needs:
    - unit-test
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
  script:
    - mkdir -p dist
    - echo "replace with your real build command" > dist/README.txt
