# Trusted host only. Do not use this pattern for untrusted multi-tenant workloads.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  tags:
    - shell-trusted
  interruptible: true
  variables:
    GIT_STRATEGY: clone
    PIP_CACHE_DIR: .cache/pip
  cache:
    key: ${CI_PROJECT_PATH_SLUG}-${CI_DEFAULT_BRANCH}
    paths:
      - .cache/pip

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install -r requirements.txt
    - pytest -q

deploy:
  stage: deploy
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - ./scripts/deploy.sh
