# A check that cannot fail, a GitLab-unsupported shell default, a token written
# into .git/config, and a docker login with the password on the command line.
variables:
  CI_SERVER_PROTOCOL: "${CI_SERVER_PROTOCOL:-https}"

stages:
  - test

lint:
  stage: test
  timeout: 10 minutes
  allow_failure: true
  script:
    - npm run lint || true
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
