# Clean fixture: every rule in validate_runner_config.py must stay silent here.
concurrent = 6
check_interval = 3

[[runners]]
  name = "k8s-build"
  url = "https://gitlab.example.com/"
  token = "glrt-REPLACE_WITH_AUTH_TOKEN"
  executor = "kubernetes"

  [runners.cache]
    Type = "s3"
    Shared = false
    [runners.cache.s3]
      ServerAddress = "minio.example.internal:9000"
      BucketName = "gitlab-runner-cache"
      BucketLocation = "ir-thr-at1"

  [runners.kubernetes]
    namespace = "gitlab-runner"
    service_account = "gitlab-runner"
    image = "registry.example.com:5000/ci/toolchain:1.8.3"
    helper_image = "registry.example.com:5000/mirror/gitlab-runner-helper:x86_64-v19.1.2"
    image_pull_secrets = ["registry-pull"]
    poll_timeout = 600
    cleanup_resources_timeout = "10m"
    privileged = false
    pull_policy = ["always"]
    allowed_pull_policies = ["always"]
    allowed_images = ["registry.example.com:5000/ci/toolchain:*"]
    allowed_services = ["registry.example.com:5000/mirror/postgres:*"]
    logs_base_dir = "/tmp"
    scripts_base_dir = "/tmp"
    [runners.kubernetes.node_selector]
      "kubernetes.io/os" = "linux"
