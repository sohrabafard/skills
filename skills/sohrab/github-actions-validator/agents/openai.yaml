interface:
  display_name: "GitHub Actions Validator"
  short_description: "Validate, lint, and security-audit GitHub Actions workflows and actions"
  default_prompt: "Use $github-actions-validator to lint workflows with actionlint, dry-run with act, audit permissions/OIDC/pinned versions, and report fixes for .github/workflows and custom actions. Read its references for the full workflow."

policy:
  allow_implicit_invocation: true
