  short_description: "Documentation-only JSDoc and comment pass for Vue and Quasar"
  default_prompt: "Use $alaa-frontend-doc-annotations to run a documentation-only annotation pass: JSDoc and inline comments only, the build output byte-identical before and after, then run scripts/check-annotations.mjs and report its findings."

