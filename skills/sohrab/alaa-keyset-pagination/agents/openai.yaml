interface:
  display_name: "Alaa Keyset Pagination"
  short_description: "Keyset pagination: ordering, index, signed cursor"
  default_prompt: "Use $alaa-keyset-pagination whenever a route returns a collection that grows with tenant data, when a list repeats or drops rows, when a list query slows on later pages, or before claiming backward pagination works. Choose the traversal mode first: keyset cursor for every public and user-facing collection, chunked primary-key traversal for exports and backfills, and offset only for an admin route meeting all five documented conditions. Resolve sort through a closed server-side allowlist and never pass a request string to orderBy. End every ordering tuple in a column that is unique under the route's filters and give every component the same direction, because a strict continuation predicate silently drops every row sharing the boundary value. Write the predicate as a row-value comparison and never as an OR expansion, which PostgreSQL cannot serve as a range scan under ORDER BY. Prove the index with EXPLAIN (ANALYZE, BUFFERS) at the route's maximum limit and assert on buffers, not on the Index Cond text. Bind filters, sort, direction, and scope into the HMAC-signed cursor, verify the signature before parsing any field, and reject a context mismatch with INVALID_CURSOR_CONTEXT rather than serving a page. Forbid nullable ordering columns and live mutable sort values, and use the replacements the skill names. Emit data plus meta.next_cursor and meta.prev_cursor, never a separate pagination object, never has_more, and never totals. Reject a malformed cursor with 400 and never with an empty 200. Cover every item in the skill's test list before shipping, and defer to $alaa-services-contract for envelopes, $alaa-data-layer for index mechanics, $alaa-security-review for cursor tampering, $alaa-testing-strategy for what makes a test a test, and $alaa-prompting-guide for model and effort."
  brand_color: "#7A5C3E"

policy:
  allow_implicit_invocation: true
