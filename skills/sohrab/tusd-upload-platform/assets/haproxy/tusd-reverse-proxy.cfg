# Template HAProxy front door for an upload plane.
#
# Adapt bind addresses, TLS material, ACLs, auth and stickiness. Directive
# syntax and tuning belong to /alaa-haproxy ($alaa-haproxy); the behaviours this file must
# preserve are in references/70-front-door.md.
#
# Behaviours that are not negotiable:
#  - request buffering stays off;
#  - PATCH, HEAD, OPTIONS and DELETE reach the backend unchanged;
#  - Upload-Offset is never rewritten or cached;
#  - Location is correct as the client sees it, by exactly one mechanism;
#  - client-supplied trusted internal headers are stripped on every path;
#  - the metrics path is unreachable from outside the internal network.

global
  log stdout format raw local0
  maxconn 20000
  # If HAProxy generates request ids, define unique-id-format and
  # unique-id-header here and forward that header to the backend and hooks.

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option forwardfor
  timeout connect 5s
  timeout http-request 30s
  # `timeout client` CANNOT be overridden per backend. A short value here
  # drops any client that stalls mid-PATCH, no matter what the upload
  # backend's own timeouts say. Size it from the longest legitimate PATCH on
  # the slowest link the product supports, or give uploads their own frontend
  # with its own defaults. This is the single most common upload-plane
  # timeout defect.
  timeout client 15m
  timeout server 15m
  timeout queue 30s
  default-server init-addr last,libc,none
  # Do not enable: option http-buffer-request

frontend fe_tusd
  bind :443 ssl crt /etc/haproxy/certs/uploads.pem alpn h2,http/1.1

  acl is_metrics path /metrics
  acl is_uploads path_beg /files/
  acl metrics_net src 10.0.0.0/8 192.168.0.0/16

  # Strip client-supplied copies of every trusted internal header before the
  # request can reach the backend, on every path and not only on creation.
  # The backend has no way to tell an injected header from a real one.
  http-request del-header X-User-Id
  http-request del-header X-Project-Id
  http-request del-header X-Access
  http-request del-header X-Access-Token-Id

  http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]
  http-request set-header traceparent %[req.hdr(traceparent)] if { req.hdr(traceparent) -m found }

  # Replace with the platform's auth layer. Authorization must run on POST,
  # PATCH, HEAD and DELETE through the same rule, not only on POST.
  # http-request deny deny_status 401 if is_uploads !{ req.hdr(Authorization) -m found }

  http-request deny deny_status 403 if is_metrics !metrics_net

  use_backend be_tusd if is_uploads
  use_backend be_tusd_metrics if is_metrics
  default_backend be_tusd

backend be_tusd
  balance source
  # Stickiness is a mitigation, not a lock. An instance restart loses
  # affinity and the next PATCH finds no local lock.
  # cookie TUSD_NODE insert indirect nocache

  # Exactly one mechanism must own the public upload URL: either the backend
  # respects forwarded headers, or this proxy rewrites Location on the way
  # out. If neither is true the client gets an internal URL; if both are, the
  # URL is rewritten twice. Uncomment only when the backend does NOT set
  # -behind-proxy / RespectForwardedHeaders.
  # http-response replace-header Location ^/files/(.*)$ /uploads/files/\1

  option httpchk GET /metrics
  http-check expect status 200

  server tusd-1 127.0.0.1:1080 check
  # server tusd-2 127.0.0.1:1081 check cookie tusd-2

backend be_tusd_metrics
  server tusd-metrics 127.0.0.1:1080 check
