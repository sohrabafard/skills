# Template reverse proxy for tusd.
#
# Adapt upstream names, TLS settings, ACLs, sticky-session strategy, and the
# allowed origins to match your platform.
#
# Important behaviors:
# - Do not append a path to proxy_pass unless you intentionally rewrite paths.
# - Keep request buffering off.
# - Protect /metrics separately.
# - Add your gateway auth layer before forwarding to tusd.
# - Review timeouts for large or slow PATCH requests.

upstream tusd_backend {
    server 127.0.0.1:1080;
    # For multiple stock tusd instances, add a sticky-session strategy here.
}

server {
    listen 443 ssl;
    server_name uploads.example.com;

    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;

    client_max_body_size 0;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    send_timeout 900s;

    # Replace with your auth layer if Nginx is not the auth gateway.
    # auth_request /internal/authz;

    location /files/ {
        proxy_pass http://tusd_backend;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }

    location /metrics {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://tusd_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
