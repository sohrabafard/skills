# Register (a): the official tusd binary writing to local staging disk, for
# the stage-then-relay topology in references/30-topologies.md.
#
# TUSD_IMAGE has no default on purpose; see the note in tusd-s3.compose.yaml.
services:
  tusd-staging:
    image: ${TUSD_IMAGE:?set TUSD_IMAGE to a pinned tusd release; see references/10-source-map.md}
    restart: unless-stopped
    env_file:
      - ../env/tusd-staging.env.example
    command:
      - "-host=0.0.0.0"
      - "-port=8080"
      - "-base-path=/files/"
      - "-behind-proxy"
      - "-disable-download"
      # Mandatory. An unset -max-size means unlimited.
      - "-max-size=${TUSD_MAX_SIZE}"
      # Uncomment unless the product exposes cancellation through tus.
      # - "-disable-termination"
      - "-cors-allow-origin=${TUSD_CORS_ALLOW_ORIGIN}"
      - "-cors-allow-headers=Authorization,X-Request-Id,traceparent,Tus-Resumable,Upload-Length,Upload-Defer-Length,Upload-Metadata,Upload-Offset"
      - "-cors-expose-headers=Location,Upload-Offset,Upload-Length,Upload-Defer-Length,Upload-Metadata,Upload-Expires,Tus-Resumable,Tus-Version,Tus-Extension,Tus-Max-Size,X-Request-Id,traceparent"
      - "-hooks-http=${TUSD_HOOKS_HTTP}"
      - "-hooks-http-forward-headers=X-Project-Id,X-User-Id,X-Access,X-Access-Token-Id,X-Request-Id,traceparent"
      - "-hooks-enabled-events=pre-create,post-create,post-receive,pre-finish,post-finish,pre-terminate,post-terminate"
      - "-progress-hooks-interval=${TUSD_PROGRESS_HOOKS_INTERVAL}"
      - "-log-format=json"
      - "-metrics-path=/metrics"
      - "-network-timeout=${TUSD_NETWORK_TIMEOUT}"
      - "-shutdown-timeout=${TUSD_SHUTDOWN_TIMEOUT}"
      - "-request-completion-timeout=${TUSD_REQUEST_COMPLETION_TIMEOUT}"
      - "-acquire-lock-timeout=${TUSD_ACQUIRE_LOCK_TIMEOUT}"
      - "-upload-dir=/data/uploads"
      - "-dir-perms=0750"
      - "-file-perms=0640"
    ports:
      - "127.0.0.1:${TUSD_BIND_PORT:-1081}:8080"
    volumes:
      # Staging holds whole files until the relay worker has copied them and
      # cleanup has run. Retention for unfinished and relayed files is
      # mandatory; see references/35-storage-lifecycle.md.
      - tusd_staging_data:/data/uploads

volumes:
  tusd_staging_data:
