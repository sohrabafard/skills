services:
  tusd-staging:
    image: ${TUSD_IMAGE:-tusproject/tusd:v2.9.2}
    restart: unless-stopped
    env_file:
      - ../env/tusd-staging.env.example
    command:
      - "-host=0.0.0.0"
      - "-port=8080"
      - "-base-path=/files/"
      - "-behind-proxy"
      - "-disable-download"
      # Uncomment if clients must not delete uploads through tus.
      # - "-disable-termination"
      - "-cors-allow-origin=${TUSD_CORS_ALLOW_ORIGIN}"
      - "-cors-allow-headers=Authorization,X-Request-Id,traceparent,Tus-Resumable,Upload-Length,Upload-Defer-Length,Upload-Metadata,Upload-Offset,Upload-Checksum,Upload-Concat"
      - "-cors-expose-headers=Location,Upload-Offset,Upload-Length,Upload-Defer-Length,Upload-Metadata,Upload-Expires,Tus-Resumable,Tus-Version,Tus-Extension,Tus-Max-Size,Tus-Checksum-Algorithm,X-Request-Id,traceparent"
      - "-hooks-http=${TUSD_HOOKS_HTTP}"
      - "-hooks-http-forward-headers=X-Project-Id,X-User-Id,X-Access,X-Access-Token-Id,X-Request-Id,traceparent,X-User-Mobile,X-User-Fname,X-User-Lname"
      - "-hooks-enabled-events=pre-create,post-create,post-receive,pre-finish,post-finish,pre-terminate,post-terminate"
      - "-progress-hooks-interval=${TUSD_PROGRESS_HOOKS_INTERVAL}"
      - "-log-format=json"
      - "-metrics-path=/metrics"
      - "-network-timeout=${TUSD_NETWORK_TIMEOUT}"
      - "-shutdown-timeout=${TUSD_SHUTDOWN_TIMEOUT}"
      - "-request-completion-timeout=${TUSD_REQUEST_COMPLETION_TIMEOUT}"
      - "-acquire-lock-timeout=${TUSD_ACQUIRE_LOCK_TIMEOUT}"
      - "-upload-dir=/data/uploads"
      - "-dir-perms=0750"
      - "-file-perms=0640"
    ports:
      - "127.0.0.1:${TUSD_BIND_PORT:-1081}:8080"
    volumes:
      - tusd_staging_data:/data/uploads

volumes:
  tusd_staging_data:
