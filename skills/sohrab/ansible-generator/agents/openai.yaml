interface:
  display_name: "Ansible Generator"
  short_description: "Generate idempotent, FQCN-correct Ansible playbooks/roles, then validate"
  default_prompt: "Use $ansible-generator to scaffold production Ansible playbooks/roles/inventories (FQCN modules, idempotency, vault, structure), then run $ansible-validator and fix until clean. Read its references for patterns."

policy:
  allow_implicit_invocation: true
