---
# Collection and role dependencies.
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-galaxy role install -r requirements.yml
#
# Every collection a playbook or role uses is declared here with a floor. State
# the version whose behaviour you relied on: a floor several majors behind, such
# as community.general >=8.0.0, asserts nothing.
#
# Re-derive an installed collection's version with:
#   ansible-galaxy collection list <namespace.name>
# The name-to-collection mapping is ansible-validator (/ansible-validator,
# $ansible-validator) at its references/module_alternatives.md.

collections:
  # ansible.posix provides authorized_key, synchronize, acl, firewalld, mount,
  # selinux, seboolean, sysctl and at. All of those left ansible-core; the
  # short names still resolve through a redirect, which is why they must be
  # declared rather than assumed.
  - name: ansible.posix
    version: ">=2.0.0"

  # community.general provides archive, ufw, timezone, htpasswd, parted, lvol,
  # lvg, alternatives, sysvinit and many others.
  - name: community.general
    version: ">=11.0.0"

# Add only what the project actually uses. An unused collection is a download
# and a supply-chain surface with no benefit.
