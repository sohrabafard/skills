# Project ansible.cfg
# Reference: https://docs.ansible.com/ansible/latest/reference_appendices/config.html
# Validate this file with: ansible-config validate -t all
#
# Verified 2026-07-29 against ansible-core 2.19.11: every key below is accepted.

[defaults]
inventory = inventory/
roles_path = roles/
collections_path = collections/:~/.ansible/collections:/usr/share/ansible/collections

# True. A host whose key you have not accepted is a host you have not verified,
# and turning this off removes the only protection against a machine-in-the-
# middle on the management path. For genuinely ephemeral hosts, collect keys
# into a known-hosts file the play references with ansible.builtin.known_hosts
# rather than disabling the check for every host in the project.
host_key_checking = True

retry_files_enabled = False
interpreter_python = auto_silent

# Fact caching. fact_caching_timeout is 86400 seconds; that single value is
# owned by ansible-validator (/ansible-validator, $ansible-validator) at its
# references/best_practices.md rule 6.5, and this file
# does not restate a different one.
# fact_caching_connection is deliberately not /tmp: /tmp is world-writable on a
# shared host and does not exist on a Windows control node. Point it at a
# project-local directory that is in .gitignore.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible-cache/facts
fact_caching_timeout = 86400

stdout_callback = yaml
bin_ansible_callbacks = True

# callbacks_enabled, not callback_whitelist. The old name was renamed in
# ansible-core 2.11 and now fails `ansible-config validate -t all` as an unknown
# key in section 'defaults'.
callbacks_enabled = timer, profile_tasks

deprecation_warnings = True
display_skipped_hosts = False
display_args_to_stdout = False

# A run whose output nobody kept cannot be diagnosed afterwards. Point this at a
# path the automation user can write and the retention policy covers. Whether a
# signal is required at all is /alaa-observability-soc's ($alaa-observability-soc).
log_path = .ansible-cache/ansible.log

timeout = 30
poll_interval = 15

# forks is the number of hosts configured in parallel. 5 is the stock default;
# state the number this fleet was sized for rather than shipping the default as
# if it were a decision. What the number should be is /alaa-reliability-sla's
# ($alaa-reliability-sla).
forks = 5

[privilege_escalation]
# No blanket "become = True". Escalating the whole project means every ad-hoc
# `ansible -m` command also runs as root, and an audit cannot tell which tasks
# genuinely needed it. Put `become: true` on the tasks that need it.
become_method = sudo
become_ask_pass = False

[ssh_connection]
# ControlPersist reuses one SSH connection across tasks. 60s covers a normal
# play; raise it for a long play against a high-latency link.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# Pipelining removes one round trip per task and dominates run time on a
# high-latency link. It requires that the target's sudoers has no `requiretty`.
pipelining = True
timeout = 30
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/ansible-ssh-%%h-%%p-%%r

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[diff]
always = False
context = 3
