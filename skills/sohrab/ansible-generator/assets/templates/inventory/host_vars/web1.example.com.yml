---
# Host-specific variables for web1.example.com.
# Put a value here only when it genuinely differs from the group. A value that
# is the same on every host belongs in group_vars.

server_id: web1
datacenter: dc1
rack: A1

nginx_worker_processes: 2
nginx_worker_connections: 1024

monitoring_enabled: true
monitoring_tags:
  - production
  - webserver
  - primary
