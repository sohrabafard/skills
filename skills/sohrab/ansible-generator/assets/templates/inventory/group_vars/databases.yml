---
# Variables for the databases group.

db_type: postgresql

postgresql_version: 17
postgresql_port: 5432
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
# Loopback only. A wider bind is an explicit decision, not a default.
postgresql_listen_addresses: 127.0.0.1
postgresql_max_connections: 100

db_backup_enabled: true
db_backup_dir: /var/backups/databases
db_backup_retention_days: 7
db_backup_schedule: "0 2 * * *"

db_monitoring_enabled: true
db_slow_query_logging: true

# Schema shape, index choice and migration ordering are /alaa-data-layer's
# ($alaa-data-layer). This file holds only the host-level facts the role needs.
