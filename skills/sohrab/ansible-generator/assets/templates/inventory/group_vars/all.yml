---
# Variables applied to every host in this inventory.

# Connection. ansible_user and the key path are per-environment facts; keep them
# here rather than on the command line so they are recorded and reviewable.
ansible_user: CHANGE_ME_automation_user
ansible_python_interpreter: /usr/bin/python3
# Point this at a key the whole team can resolve, not at one developer's
# ~/.ssh/id_rsa. A path under the project, or an ssh-agent, both work.
ansible_ssh_private_key_file: CHANGE_ME_path_to_deploy_key

# Packages every host gets
common_packages:
  - vim
  - git
  - curl

# Time
ntp_enabled: true
ntp_timezone: UTC

# SSH hardening applied by the common role
security_ssh_port: 22
security_ssh_password_authentication: false
security_ssh_permit_root_login: false

# Secrets are never literals here. Put the value in an encrypted file and
# reference the vaulted variable, so that a grep for the name finds a definition
# rather than a wall of ciphertext:
#   ansible-vault encrypt_string 'value' --name 'vault_deploy_token'
# ansible-validator (/ansible-validator, $ansible-validator)
# references/security_checklist.md section S3 holds the
# full Vault procedure.
# deploy_token: "{{ vault_deploy_token }}"
