---
# Role: ROLE_NAME
# Main task list.

- name: Load the OS-family variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags:
    - always

- name: Ensure the package is installed
  ansible.builtin.package:
    name: "{{ ROLE_NAME_package_name }}"
    state: present
  tags:
    - install
    - packages

- name: Ensure the service directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ROLE_NAME_user }}"
    group: "{{ ROLE_NAME_group }}"
    mode: "{{ ROLE_NAME_dir_mode }}"
  loop:
    - "{{ ROLE_NAME_config_dir }}"
    - "{{ ROLE_NAME_data_dir }}"
    - "{{ ROLE_NAME_log_dir }}"
  tags:
    - configure
    - directories

- name: Deploy the service configuration
  ansible.builtin.template:
    src: config.j2
    dest: "{{ ROLE_NAME_full_config_path }}"
    owner: "{{ ROLE_NAME_user }}"
    group: "{{ ROLE_NAME_group }}"
    mode: "{{ ROLE_NAME_config_mode }}"
    backup: true
    # validate runs the service's own config checker against the candidate file
    # before it replaces the live one, so a bad render cannot take the service
    # down. %s is the path of the candidate. Delete this line only if the
    # service ships no checker.
    validate: "CHANGE_ME_validate_command %s"
  notify: Restart the service
  tags:
    - configure

- name: Ensure the service is started and enabled
  ansible.builtin.service:
    name: "{{ ROLE_NAME_service_name }}"
    state: started
    enabled: true
  tags:
    - service
