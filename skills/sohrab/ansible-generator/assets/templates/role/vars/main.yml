---
# Role: ROLE_NAME
# Role variables. High precedence: a caller cannot practically override these.
# Anything a caller may legitimately change belongs in defaults/main.yml instead.
# The precedence table is ansible-validator (/ansible-validator,
# $ansible-validator) at its references/best_practices.md rule 6.2.

# Values derived from the defaults above
ROLE_NAME_full_config_path: "{{ ROLE_NAME_config_dir }}/config.yml"
ROLE_NAME_pid_file: "/run/{{ ROLE_NAME_service_name }}.pid"

# Internal constants that are not configuration
ROLE_NAME_config_owner: root
