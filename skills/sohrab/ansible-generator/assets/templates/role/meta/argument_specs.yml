---
# Role: ROLE_NAME
# Role argument specification.
#
# This is validation at the boundary: Ansible checks every entry below before
# the role's first task runs, so a missing or mistyped variable is a refusal at
# the start rather than a Jinja error in the middle of a partly applied run.
# ansible-lint's role-argument-spec rule reports a role that has none.
#
# Placeholder convention: replace ROLE_NAME and every CHANGE_ME_* token.
# references/scaffold.md states it once.

argument_specs:
  main:
    short_description: CHANGE_ME_one_line_description
    description:
      - CHANGE_ME_what_this_role_installs_or_configures
      - CHANGE_ME_what_it_deliberately_does_not_do
    author:
      - CHANGE_ME_author

    options:
      ROLE_NAME_package_name:
        type: str
        required: false
        default: CHANGE_ME_package
        description: Name of the package to install.

      ROLE_NAME_version:
        type: str
        required: true
        description: >-
          Version to install. Required, and not defaulted to "latest", because
          an unpinned version makes the run non-reproducible.

      ROLE_NAME_port:
        type: int
        required: false
        default: 8080
        description: TCP port the service listens on.

      ROLE_NAME_bind_address:
        type: str
        required: false
        default: 127.0.0.1
        description: >-
          Interface address to bind. Defaults to the loopback address; a wider
          bind is an explicit decision the caller makes.

      ROLE_NAME_enable_ssl:
        type: bool
        required: false
        default: false
        description: Whether to configure TLS for the service.

      ROLE_NAME_packages:
        type: list
        elements: str
        required: false
        default:
          - CHANGE_ME_package_one
          - CHANGE_ME_package_two
        description: Additional packages this role installs.

      ROLE_NAME_config:
        type: dict
        required: false
        default: {}
        description: Service configuration rendered into the template.
        options:
          host:
            type: str
            required: false
            default: localhost
            description: Hostname the service advertises.
          port:
            type: int
            required: false
            default: 5432
            description: Port of the backing service.

      ROLE_NAME_config_dir:
        type: path
        required: false
        default: /etc/CHANGE_ME_service
        description: Directory holding the service configuration.

      ROLE_NAME_state:
        type: str
        required: false
        default: present
        choices:
          - present
          - absent
        description: >-
          Whether the role installs or removes the service. "latest" is
          deliberately absent: it makes every run non-idempotent.

# Available types: str, int, float, bool, list, dict, path, raw, jsonarg, json,
# bytes, bits. Use path rather than str for a filesystem path so that Ansible
# expands "~" and reports a non-absolute value.
