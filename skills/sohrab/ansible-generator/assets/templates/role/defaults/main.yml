---
# Role: ROLE_NAME
# Default variables. Lowest precedence: a caller may override any of these.
#
# Placeholder convention: replace every ROLE_NAME with the role's name and every
# CHANGE_ME_* token with a real value. Both are bare YAML tokens, so this file
# parses before substitution and scripts/check_templates.py can prove it.
# The full convention is in references/scaffold.md.

# Package and service names
ROLE_NAME_package_name: "CHANGE_ME_package"
ROLE_NAME_service_name: "CHANGE_ME_service"

# Account the service runs as
ROLE_NAME_user: "CHANGE_ME_service_user"
ROLE_NAME_group: "CHANGE_ME_service_group"

# Directories
ROLE_NAME_config_dir: "/etc/CHANGE_ME_service"
ROLE_NAME_data_dir: "/var/lib/CHANGE_ME_service"
ROLE_NAME_log_dir: "/var/log/CHANGE_ME_service"

# Network. Bind to the loopback interface by default. A wider bind is an
# explicit decision the caller makes, not a default the role ships.
ROLE_NAME_port: 8080
ROLE_NAME_bind_address: "127.0.0.1"
ROLE_NAME_max_connections: 100

# File modes. No mode grants write to other.
ROLE_NAME_config_mode: "0644"
ROLE_NAME_secret_mode: "0600"
ROLE_NAME_dir_mode: "0755"

# Feature flags
ROLE_NAME_enable_ssl: false
ROLE_NAME_enable_monitoring: true
ROLE_NAME_enable_backup: true

# Version. Pin it: "latest" makes the run non-reproducible and trips
# ansible-lint's package-latest rule.
ROLE_NAME_version: "CHANGE_ME_version"
