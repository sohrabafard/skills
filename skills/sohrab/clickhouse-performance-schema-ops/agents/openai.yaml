interface:
  display_name: "ClickHouse Performance, Schema, Ingest, and Operations"
  short_description: "ClickHouse schema, topology, ingest, query, and client lanes"
  default_prompt: "Use $clickhouse-performance-schema-ops for ClickHouse schema, topology, ingest, query, and operations work. Name the audience before proposing DDL: the ingest-pipeline repository owns the DDL, and a read-lane service cannot execute DDL. Name the declared topology mode before choosing an engine. Route the task through references/00-topic-map.md, and run scripts/review_clickhouse_ddl.py over any CREATE TABLE you write or review and paste its output."

policy:
  allow_implicit_invocation: true
