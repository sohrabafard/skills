interface:
  display_name: "Alaa Testing Strategy"
  short_description: "Test design, execution, resources and evidence"
  default_prompt: "Use $alaa-testing-strategy to design, review, repair or run tests and validation commands, directly or through either runtime. Before execution, read references/100-test-execution.md for scope, selection, collection, batch repair and result validity, and references/110-execution-resources.md for CPU budgets, runners and timing. Before interpreting results or repairing failures, read references/120-result-classification.md. Enumerate the change's failure modes once, shared with $alaa-observability-soc, and derive one test per mode; never start from the happy path. Name each test's plausible broken implementation and prove it by removal: delete or invert the mechanism and require the test to fail. Assert the absence of the effect a refusal prevents, not only the error code. Place each behaviour at exactly one layer, the smallest set of real components that can produce the failure. Record for each double whether it can drift and what parity suite binds it. Report each claim at the proof level that actually ran (static, unit, parity, local smoke, in-runtime or live-dependency), never higher. Classify an intermittent failure as a product defect or a broken test before acting, and never propose a blanket retry. Report named coverage obligations, not a percentage, and report a check not observed to run as not run."
  brand_color: "#6B7A2E"

policy:
  allow_implicit_invocation: true
