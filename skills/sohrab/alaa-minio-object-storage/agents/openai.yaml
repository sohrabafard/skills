interface:
  display_name: "Alaa MinIO Object Storage"
  short_description: "Buckets, lifecycle, IAM, TLS, presigned URLs"
  default_prompt: "Use $alaa-minio-object-storage for any bucket, object key, storage credential or storage policy. Confirm object storage is the right store first, and send the store-selection question to $alaa-data-layer. Never let an application identity hold the store's root credentials; give each service a scoped identity naming exactly its bucket and prefixes. Put an AbortIncompleteMultipartUpload lifecycle rule with a stated maximum age on every bucket that receives multipart uploads, because abandoned parts are billed and appear in no listing. Take every object key's tenant segment from the trusted request context, never from client input. Keep credentials out of committed files, logs, exceptions, URLs, metric labels and command lines — a value the shell expands into argv is readable in the process list and recorded in shell history — and make them rotatable without a code change. Read every storage value that is a guess, a provider limit, or a thing that differs between MinIO and ArvanCloud or between a test stack and production from a named STORAGE_* environment variable with a default this skill states, and validate it before the storage client is constructed; references/05-environment-contract.md owns the names, defaults, evidence and validation, and extends the STORAGE_* family the fleet already uses rather than inventing a parallel one. Set STORAGE_SIGNATURE_VERSION explicitly rather than relying on a library default, because a default that changes on an upgrade fails authentication in a way that looks like a wrong credential. Where a provider's own published numbers conflict, take the minimum as the default and say that is why. Treat enabling bucket versioning as irreversible, since it can only be suspended afterwards, and add a noncurrent-version expiration rule in the same change. Get the owner's explicit authorization before running any mc command that writes or deletes. Use TLS on every path whose endpoint host is not loopback. Serve a user's download of their own file through a presigned URL bounded by STORAGE_PRESIGN_MAX_SECONDS or through the application, and never by making the bucket publicly readable, because public read is an unbounded, unauthenticated and unrevocable grant over every object in the bucket while a presigned URL names one object and expires on its own. Never treat the store as the source of truth for a fact a database holds, and never read a failed call as proof an object is absent. Read a Compose file's credentials, ports and root-user posture as properties of a test stack and never as a description of production, because production takes its endpoint, bucket, region and credentials from the environment, so a rule written against a Compose file is not evidence about production. Run scripts/check_object_storage_posture.py --root <repo> and treat any finding as blocking. Cite every upstream S3 or MinIO claim with its read date and mark it unverified when it was not fetched."

policy:
  allow_implicit_invocation: true
