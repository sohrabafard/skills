interface:
  display_name: "Alaa IndexedDB Browser Storage"
  short_description: "IndexedDB, browser storage, quota, offline sync"
  default_prompt: "Use $alaa-indexeddb-browser-storage to design IndexedDB/browser-storage features that preserve Alaa SDK-owned auth, gateway trust boundaries, quota handling, migrations, and testing."

policy:
  allow_implicit_invocation: true
  primary_domains:
    - indexeddb
    - browser-storage
    - offline-state
    - local-cache
    - outbox-sync
    - quota-eviction
    - client-storage-security
