interface:
  display_name: "Fluent Bit Validator"
  short_description: "Validate, lint, and dry-run Fluent Bit configs"
  default_prompt: "Use $fluentbit-validator to validate Fluent Bit config syntax, required parameters, parser/tag correctness, security, and OTel/output behavior, then report fixes. Pair with $fluentbit-generator when authoring."

policy:
  allow_implicit_invocation: true
