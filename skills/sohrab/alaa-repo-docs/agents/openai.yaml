interface:
  display_name: "Alaa Repo Docs"
  short_description: "Repository docs, ownership, links, and language"
  default_prompt: "Use $alaa-repo-docs to align repository documentation with code and contracts, preserve each document's existing language, give every topic one canonical home, replace duplicated detail with summaries and relative links, and create a localized companion such as README.fa.md only when I explicitly request it."
  brand_color: "#2E6F63"

policy:
  allow_implicit_invocation: true
