name = "alaa-implementer"
description = "Implementation lane for a stack with no bound role, such as Ansible, a Makefile, a shell script or another language, or for a lane whose owned files span two stack families and cannot be split. The dispatch names the owning skills. Never self-reviews or widens scope. The task, not this ID, selects model and effort."
