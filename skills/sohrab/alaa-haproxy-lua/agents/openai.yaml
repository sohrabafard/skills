interface:
  display_name: "Alaa HAProxy Lua"
  short_description: "Lua inside HAProxy: actions, services, failure, tests"
  default_prompt: "Use $alaa-haproxy-lua for any .lua file HAProxy loads. Record +LUA and the Built with Lua version line from haproxy -vv first, and delete the Lua when a native sample fetch, converter, ACL, map, or stick table already produces the value. Choose lua-load or lua-load-per-thread from whether state must be shared, before writing code. Guard every registration behind a core check and return the module table, so the module loads under a mock core in a unit test. HAProxy reads the return value of a converter and a sample fetch and nothing back from an action or a service: never return nil from the first pair, because it becomes a boolean-false sample that sets the variable and renders as 0, and give the second pair a named failure variable plus a rejecting configuration rule. Use core.tcp() and its Socket methods for a subrequest, which yield to the scheduler, and never io.*, os.execute, or print, which do not. Close the socket on every exit path and reject carriage return and line feed before concatenating any value into a request line. Validate with scripts/check_haproxy_lua.py, then the unit test under the interpreter haproxy -vv named, then haproxy -c -f. Route directives to $alaa-haproxy, contract names and values to $alaa-services-contract, and the codec contract to $alaa-crockford-base32-codecs."
  brand_color: "#2E6B8A"

policy:
  allow_implicit_invocation: true
