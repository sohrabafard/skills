# token-guard.cfg - the smallest configuration that loads token-guard.lua and
# fails closed on a rejected token. Validate it before shipping:
#
#     haproxy -c -f token-guard.cfg
#
# `haproxy -c` loads and compiles every Lua file named by lua-load and
# lua-load-per-thread, so a Lua syntax error fails this check with exit code 1.

global
    # Per thread, because the module holds no mutable state and per-thread
    # loading avoids the global Lua lock.
    lua-load-per-thread /etc/haproxy/lua/token-guard.lua

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend edge
    bind :8080

    # Set txn.raw_token from the field that /alaa-services-contract
    # ($alaa-services-contract) names for this value; that skill owns every
    # header, field, and wire-format name and this skill states none. Until
    # that line is added, txn.raw_token is unset, the converter never runs, and
    # every request is denied - which is the correct default for a guard.
    #   http-request set-var(txn.raw_token) req.hdr(<field-name-from-contract>)
    http-request set-var(txn.token) var(txn.raw_token),lua.token_guard(64)

    # The converter raises on a malformed token, so the sample fails and
    # txn.token stays unset. Rejecting on "not found" is what makes the
    # failure closed; without this rule a rejected token is simply absent and
    # the request continues.
    http-request deny deny_status 400 unless { var(txn.token) -m found }

    default_backend app

backend app
    server app1 127.0.0.1:8081 check
