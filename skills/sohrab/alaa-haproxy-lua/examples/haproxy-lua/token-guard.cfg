# Charter: isolated opaque-token validation and explicit rejection example.
# Minimum branch: HAProxy 3.4.6 with +LUA; validated with Lua 5.4.8.
# Preconditions: run from this directory; replace the example input for deployment.
# Variables: X-Example-Token is a lab header, not a fleet identity contract.
# Failure mode: absent/invalid token is 400; valid token is 200; no backend traffic.
global
    tune.lua.openlibs string
    tune.lua.bool-sample-conversion normal
    lua-load-per-thread token-guard.lua

defaults
    mode http
    timeout connect 1s
    timeout client 2s
    timeout server 2s

frontend example
    bind 127.0.0.1:18081
    http-request unset-var(txn.token)
    http-request set-var(txn.token) req.hdr(X-Example-Token),lua.token_guard(64)
    http-request deny deny_status 400 unless { var(txn.token) -m found }
    http-request return status 200
