# no-contract.cfg
# This fixture deliberately states nothing about itself.
global
  master-worker

defaults api
  mode http
  retries 3

peers cluster
  bind :1024
  server a
  server b 10.0.0.2:1024

frontend fe from api
  bind :8080
  idle-ping 30s
  default_backend be

backend be from api
  balance hash
  server s1 10.0.0.1:80
