stages:
  - validate
  - render
  - deploy

variables:
  HAPROXY_IMAGE: "haproxy:3.2"
  HAPROXY_CFG: "haproxy/haproxy.cfg"
  HELM_RELEASE: "haproxy-edge"
  HELM_NAMESPACE: "edge"

haproxy:validate:
  image: $HAPROXY_IMAGE
  stage: validate
  script:
    - haproxy -vv
    - haproxy -c -f "$HAPROXY_CFG"

helm:render:
  image: alpine/helm:3.17.3
  stage: render
  script:
    - helm lint charts/haproxy -f charts/haproxy/values.yaml
    - helm template "$HELM_RELEASE" charts/haproxy -n "$HELM_NAMESPACE" -f charts/haproxy/values.yaml > rendered-haproxy.yaml
  artifacts:
    paths:
      - rendered-haproxy.yaml

k8s:dry-run:
  image: bitnami/kubectl:1.32
  stage: render
  script:
    - kubectl apply --dry-run=client -f rendered-haproxy.yaml
  needs:
    - helm:render

deploy:edge:
  image: bitnami/kubectl:1.32
  stage: deploy
  script:
    - kubectl apply -f rendered-haproxy.yaml
    - kubectl rollout status deployment/haproxy -n "$HELM_NAMESPACE" --timeout=180s
  needs:
    - helm:render
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
