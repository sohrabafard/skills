global
  master-worker
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

frontend fe_edge
  bind :443 ssl crt /etc/haproxy/certs/edge.pem alpn h2,http/1.1 accept-proxy
  http-request set-header X-Request-Id %[unique-id]
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-request set-header X-Forwarded-Host %[req.hdr(host)]
  default_backend be_gateway

backend be_gateway
  balance leastconn
  option httpchk GET /readyz
  http-check expect status 200
  http-send-name-header X-HAProxy-Gateway
  server gw1 10.0.100.11:8443 ssl verify required ca-file /etc/haproxy/ssl/internal-ca.pem send-proxy-v2 check maxconn 500
  server gw2 10.0.100.12:8443 ssl verify required ca-file /etc/haproxy/ssl/internal-ca.pem send-proxy-v2 check maxconn 500
