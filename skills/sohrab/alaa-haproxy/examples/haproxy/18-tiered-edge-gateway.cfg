# 18-tiered-edge-gateway.cfg
# Charter: outer load balancer to HAProxy to an internal gateway, with each trust boundary
#   stated explicitly.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: this listener carries `accept-proxy`, so it MUST be unreachable from anything
#   but the upstream load balancer, enforced in a NetworkPolicy, a security group or a firewall.
#   The full statement of why is in 11-proxy-protocol-chain.cfg and is not repeated here.
#   The header names crossing these boundaries - request id, forwarded proto, forwarded host -
#   are decided by /alaa-services-contract ($alaa-services-contract) and
#   /alaa-trust-gateway-auth ($alaa-trust-gateway-auth), not here.
# Variables: HAPROXY_HTTPS_PORT=443, HAPROXY_CERT_DIR=/etc/haproxy/certs,
#   HAPROXY_CA_DIR=/etc/haproxy/ca, HAPROXY_GW1=10.0.100.11:8443, HAPROXY_GW2=10.0.100.12:8443,
#   HAPROXY_GW_MAXCONN=500
# Failure mode: every header this frontend sets is set with `set-header`, which REPLACES any
#   client-supplied value. Using `add-header` instead would let a client inject a second
#   X-Request-Id and choose which one the gateway reads. The rule is: any header the downstream
#   trusts must be written with `set-header` at the first hop that can authenticate it, and
#   every other copy deleted with `http-request del-header` before it is written.
#   `X-Forwarded-Host` is derived from the client-supplied Host header and is therefore
#   attacker-controlled by construction; the gateway must treat it as input, not as identity.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults edge_http
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout queue 5s
  retries 3
  option redispatch
  option forwardfor

frontend fe_edge from edge_http
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1 accept-proxy

  # Delete before setting: a client copy must never survive to the gateway.
  http-request del-header X-Request-Id
  http-request del-header X-Forwarded-Proto
  http-request del-header X-Forwarded-Host

  http-request set-header X-Request-Id %[unique-id]
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-request set-header X-Forwarded-Host %[req.hdr(host)]

  default_backend be_gateway

backend be_gateway from edge_http
  balance leastconn
  option httpchk GET /readyz
  http-check expect status 200
  http-send-name-header X-HAProxy-Gateway
  server gw1 "${HAPROXY_GW1-10.0.100.11:8443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/internal-ca.pem" send-proxy-v2 check maxconn "${HAPROXY_GW_MAXCONN-500}" maxqueue 200
  server gw2 "${HAPROXY_GW2-10.0.100.12:8443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/internal-ca.pem" send-proxy-v2 check maxconn "${HAPROXY_GW_MAXCONN-500}" maxqueue 200
