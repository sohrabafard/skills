# 08-consistent-hash-affinity.cfg
# Charter: stable request-to-server affinity that survives a server leaving the pool.
# Minimum branch: 3.2 (`hash-preserve-affinity` and `strict-maxconn` are 3.2 keywords).
#   Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: `balance hash` takes a MANDATORY sample expression naming what is hashed.
#   `balance hash` alone is a parse error: "balance hash requires a sample expression".
#   Pick the expression from what the affinity is for - a tenant identifier for cache locality,
#   a session identifier for in-memory state. Hashing `src` re-collapses every client behind a
#   NAT or a load balancer onto one server.
# Variables: HAPROXY_HTTP_PORT=8080, HAPROXY_AFFINITY_KEY_HEADER=x-tenant-id, HAPROXY_HASH1=10.0.50.11:8080,
#   HAPROXY_HASH2=10.0.50.12:8080, HAPROXY_SERVER_MAXCONN=200
# Failure mode: consistent hashing buys a bounded remap on membership change - roughly 1/N of
#   keys move when one of N servers leaves - at the cost of a permanently uneven distribution,
#   because the key space is never split evenly. Budget for the busiest server carrying well
#   above the mean. `hash-preserve-affinity maxconn` keeps a request pinned to its server until
#   that server's `maxconn` is reached and only then rehashes, so a saturated server queues
#   rather than spilling; with `strict-maxconn` the queue is bounded by `maxqueue` and requests
#   beyond it are rejected rather than held. Without a `maxqueue` a saturated server holds
#   requests until `timeout queue` expires and the client sees a 503 with no server error.

global
  log /dev/log local0 info

defaults hash_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  timeout queue 5s
  retries 3
  option redispatch

frontend fe_hash from hash_http
  bind ":${HAPROXY_HTTP_PORT-8080}"
  default_backend be_hash

backend be_hash from hash_http
  # The expression is mandatory and it is the whole point of the file.
  balance hash req.hdr("${HAPROXY_AFFINITY_KEY_HEADER-x-tenant-id}")
  hash-type consistent
  hash-preserve-affinity maxconn

  server s1 "${HAPROXY_HASH1-10.0.50.11:8080}" check maxconn "${HAPROXY_SERVER_MAXCONN-200}" strict-maxconn maxqueue 100
  server s2 "${HAPROXY_HASH2-10.0.50.12:8080}" check maxconn "${HAPROXY_SERVER_MAXCONN-200}" strict-maxconn maxqueue 100
