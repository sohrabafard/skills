# 10-prometheus-runtime-api.cfg
# Charter: local Runtime API socket plus a Prometheus scrape endpoint on a separate frontend.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
#   The Prometheus exporter is compiled in by default; confirm with `haproxy -vv`.
# Preconditions: the metrics listener below binds LOOPBACK, which is correct only when the
#   scraper runs on the same host or in the same network namespace. When a Kubernetes Service
#   or a ServiceMonitor targets this port, a loopback bind makes the target permanently down.
#   The pod-reachable form is in examples/kubernetes/haproxy-configmap.yaml.
#   Which metrics are required and what alerts on them is decided by /alaa-observability-soc
#   ($alaa-observability-soc); their names by /alaa-services-contract ($alaa-services-contract).
# Requires-build: PROMEX
# Variables: HAPROXY_METRICS_BIND=127.0.0.1, HAPROXY_METRICS_PORT=8405,
#   HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_HTTPS_PORT=8443,
#   HAPROXY_APP1=10.0.50.11:8080, HAPROXY_APP2=10.0.50.12:8080
# Failure mode: the Runtime API socket is a full administrative control plane - it can disable
#   servers, change weights and dump the stick tables. Reaching it is equivalent to reaching
#   the config. It stays a unix socket with mode 660; exposing it on a TCP listener is the
#   single largest exposure change this skill can make and it goes to /alaa-security-review
#   ($alaa-security-review) before it is made.
#   Some counters need the `extra-counters` scrape parameter (added in 3.0) and are simply
#   absent from the exposition without it, with no error anywhere.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  maxconn 40000

defaults obs_http
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout http-keep-alive 15s
  retries 3
  option redispatch

frontend fe_public from obs_http
  bind ":${HAPROXY_HTTPS_PORT-8443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1
  http-request set-header X-Request-Id %[unique-id]
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  default_backend be_app

frontend fe_metrics from obs_http
  bind "${HAPROXY_METRICS_BIND-127.0.0.1}:${HAPROXY_METRICS_PORT-8405}"
  no log
  http-request use-service prometheus-exporter if { path /metrics }
  http-request return status 404

backend be_app from obs_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server app1 "${HAPROXY_APP1-10.0.50.11:8080}" check
  server app2 "${HAPROXY_APP2-10.0.50.12:8080}" check
