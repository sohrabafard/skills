global
  expose-experimental-directives
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

frontend fe_tls_bridge
  bind :443 ssl crt /etc/haproxy/certs/example.pem ktls on alpn h2,http/1.1
  option splice-auto
  default_backend be_tls_origin

backend be_tls_origin
  balance roundrobin
  option httpchk GET /healthz
  server app1 10.0.92.11:443 ssl verify required ca-file /etc/haproxy/ssl/origin-ca.pem ktls on check
  server app2 10.0.92.12:443 ssl verify required ca-file /etc/haproxy/ssl/origin-ca.pem ktls on check
