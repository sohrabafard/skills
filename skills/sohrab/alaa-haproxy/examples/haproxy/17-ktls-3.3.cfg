# 17-ktls-3.3.cfg
# Charter: kernel TLS on both sides of a TLS bridge, to move record encryption out of userspace.
# Minimum branch: 3.3 ("3.3 or later"). Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions, all of which must hold or the directive is rejected or silently inert:
#   - `expose-experimental-directives` before the first use. Unlike `shm-stats-file`, `ktls`
#     is STILL experimental on 3.4: removing the gate there gives
#     "'ktls' directive is experimental, must be allowed via a global
#     'expose-experimental-directives'". Verified against 3.4.0 on 2026-07-29.
#   - Linux kernel 4.17 or later. 3.3 raised HAProxy's own minimum to 4.17 for this reason.
#   - the `tls` kernel module loaded (`modprobe tls`; confirm with `lsmod | grep '^tls'`).
#   - a build compiled with kTLS support against OpenSSL 3.x or AWS-LC. Confirm from
#     `haproxy -vv` before assuming it; a distribution package frequently lacks it.
#   - a cipher the kernel implements. The kernel supports a narrower set than OpenSSL, so a
#     policy that pins an unusual ciphersuite gets no offload at all.
# Requires-build: KTLS
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_CA_DIR=/etc/haproxy/ca,
#   HAPROXY_HTTPS_PORT=443, HAPROXY_KTLS_ORIGIN1=10.0.92.11:443, HAPROXY_KTLS_ORIGIN2=10.0.92.12:443
# Failure mode: when any precondition is unmet HAProxy falls back to userspace TLS and keeps
#   serving. The config parses, the process runs, traffic is correct, and the only symptom is
#   that the CPU saving the change was made for never appears. That is a performance change that
#   silently did not happen, so verify it with a measurement, not with a diff. `option
#   splice-auto` is what lets a bridged stream skip userspace once both sides are offloaded;
#   without it the kTLS benefit on a bridge is small.

global
  expose-experimental-directives
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults ktls_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_tls_bridge from ktls_http
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" ktls on alpn h2,http/1.1
  option splice-auto
  default_backend be_tls_origin

backend be_tls_origin from ktls_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server app1 "${HAPROXY_KTLS_ORIGIN1-10.0.92.11:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem" ktls on check
  server app2 "${HAPROXY_KTLS_ORIGIN2-10.0.92.12:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem" ktls on check
