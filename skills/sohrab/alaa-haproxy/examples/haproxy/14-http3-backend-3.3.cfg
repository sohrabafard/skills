# 14-http3-backend-3.3.cfg
# Charter: HTTP/3 over QUIC towards the ORIGIN, not just towards the client.
# Minimum branch: 3.3 (the `-3.3` suffix in this skill means "3.3 or later", not "3.3 only").
#   Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: still experimental, so `expose-experimental-directives` must precede the first
#   use in the file. The build must report QUIC (`haproxy -vv`) and the TLS stack must provide
#   the QUIC API - quictls, AWS-LC or WolfSSL; see references/30-quic-http3.md. UDP must be open
#   from HAProxy to the origin, which is a different firewall rule from the client-side one.
#   The origin must actually serve HTTP/3; there is no automatic downgrade on this path.
#   BACKEND QUIC NEEDS A REAL QUIC API AND `limited-quic` DOES NOT PROVIDE ONE. A build made
#   with the OpenSSL compatibility path reports `+QUIC +QUIC_OPENSSL_COMPAT` in `haproxy -vv`
#   and still refuses this file with
#     'server be_h3_origin/app1' : The SSL stack does not provide a support for QUIC server
#   because that path gives server-side QUIC only. Frontend HTTP/3 works on such a build;
#   backend HTTP/3 does not. Verified against 3.4.0 on 2026-07-29.
# Requires-build: QUIC !QUIC_OPENSSL_COMPAT
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_CA_DIR=/etc/haproxy/ca,
#   HAPROXY_HTTPS_PORT=443, HAPROXY_H3_ORIGIN1=10.0.90.11:443, HAPROXY_H3_ORIGIN2=10.0.90.12:443
# Failure mode: an experimental directive can change name or behaviour between branches, so a
#   config that starts on 3.3 can fail to start on 3.4 or 3.5. Re-run `haproxy -c -f` against
#   the new binary as part of the upgrade, not after it. If the origin does not speak HTTP/3
#   the server stays down and the backend has no capacity at all - unlike a TCP fallback, this
#   fails hard, which is the safer of the two shapes but is not what an operator expects.
# Start with `haproxy -W -db -f <this file>`; the `master-worker` global directive is
#   deprecated from 3.3.

global
  expose-experimental-directives
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults h3_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_https from h3_http
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1
  default_backend be_h3_origin

backend be_h3_origin from h3_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  server app1 "quic4@${HAPROXY_H3_ORIGIN1-10.0.90.11:443}" check maxconn 30 ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem"
  server app2 "quic4@${HAPROXY_H3_ORIGIN2-10.0.90.12:443}" check maxconn 30 ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem"
