global
  expose-experimental-directives
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

# Use this only on HAProxy 3.3 estates that have backend HTTP/3 support
# enabled in the actual running binary.
# In 3.3, prefer starting HAProxy with -W or -Ws instead of using the
# deprecated master-worker global directive.
frontend fe_https
  bind :443 ssl crt /etc/haproxy/certs/example.pem alpn h2,http/1.1
  default_backend be_h3_origin

backend be_h3_origin
  balance roundrobin
  option httpchk GET /healthz

  # Keep this aligned with the actual 3.3 running binary and origin TLS policy.
  server app1 quic4@10.0.90.11:443 check maxconn 30 ssl verify required ca-file /etc/haproxy/ssl/origin-ca.pem
  server app2 quic4@10.0.90.12:443 check maxconn 30 ssl verify required ca-file /etc/haproxy/ssl/origin-ca.pem
