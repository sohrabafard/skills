# 20-static-asset-cache-and-rewrite.cfg
# Charter: express a caching, compression and routing POLICY as HAProxy directives. This file
#   decides no policy. It is the artifact for the boundary stated in SKILL.md and in
#   references/50-caching-routing-and-rewrites.md.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
#
# Preconditions: the policy must arrive from /alaa-frontend-devops ($alaa-frontend-devops),
#   `alaa-frontend-devops references/30-serving-caching-and-public-path.md`, as four stated
#   values, because they follow from how the build names its files and the build owns that:
#     HAPROXY_ASSET_PREFIX              the path prefix under which content-hashed files live
#     HAPROXY_HASHED_ASSET_CACHE_CONTROL the Cache-Control for a content-hashed file
#     HAPROXY_HTML_CACHE_CONTROL         the Cache-Control for an HTML document
#     HAPROXY_COMPRESS_TYPES             the media types that may be compressed
#   If any of the four is missing this file REFUSES TO START, by design. Emitting a default
#   here would be this skill deciding a policy it does not own, and every plausible default is
#   wrong for at least one row of that table.
#
# Requires-build: ZLIB
# Variables: HAPROXY_HTTP_PORT=8080 (default supplied), HAPROXY_CACHE_MAX_AGE=60,
#   HAPROXY_CACHE_TOTAL_MB=256, HAPROXY_CACHE_MAX_OBJECT=262144,
#   HAPROXY_ORIGIN=10.0.120.11:8080, plus the four policy values above, which have NO defaults.
#
# Failure mode:
#   - HAProxy's own cache is a SMALL OBJECT cache held in process memory. `total-max-size` is
#     capped at 4095 (megabytes) and `max-object-size` may be at most half of it. An object
#     larger than `max-object-size` is simply passed through uncached, silently, so a bundle
#     that grows past the ceiling stops being cached with no error and no metric change other
#     than origin load. The cache does not survive a reload or a restart, and it is per process,
#     so on N nodes the first request per node per key still reaches the origin.
#   - `path` is a REQUEST sample. Testing it directly in an `http-response` rule makes HAProxy
#     warn "acl will never match because it only involves keywords that are incompatible with
#     'frontend http-response header rule'" and the header is then never set - a caching policy
#     that silently did not apply. The correct shape is to capture the decision into a
#     transaction variable during the request phase and test the variable in the response phase,
#     which is what this file does.
#   - Compression that alters bytes breaks Subresource Integrity. Compression here is a transfer
#     encoding: the decompressed body is byte-identical to the file on disk, so an `integrity`
#     attribute still verifies. Never compress an already-compressed type - HAProxy skips those
#     it can detect, and a type list that includes image/png or application/zip only burns CPU.
#   - `replace-path` preserves the prefix the origin expects. The obligation from the frontend
#     skill is that the asset prefix arrives at the origin UNCHANGED: no rewrite strips it and
#     no rewrite duplicates it. A rewrite that strips it produces 404s for every hashed asset
#     while the HTML document loads fine, which reads as a broken deploy rather than a rewrite
#     bug.
#   - The deep-link fallback must NOT catch asset requests. If it does, a missing asset returns
#     the SPA document with status 200 and the browser parses HTML as JavaScript. The guard is
#     that the fallback applies only when the path has no file extension.

.if !defined(HAPROXY_ASSET_PREFIX)
.alert "HAPROXY_ASSET_PREFIX is not set. The asset path prefix is a build-owned policy value; get it from alaa-frontend-devops references/30-serving-caching-and-public-path.md."
.endif
.if !defined(HAPROXY_HASHED_ASSET_CACHE_CONTROL)
.alert "HAPROXY_HASHED_ASSET_CACHE_CONTROL is not set. alaa-haproxy does not choose a Cache-Control value; alaa-frontend-devops decides it because it follows from content hashing."
.endif
.if !defined(HAPROXY_HTML_CACHE_CONTROL)
.alert "HAPROXY_HTML_CACHE_CONTROL is not set. An HTML document must not inherit the immutable policy that applies to hashed assets; alaa-frontend-devops decides its value."
.endif
.if !defined(HAPROXY_COMPRESS_TYPES)
.alert "HAPROXY_COMPRESS_TYPES is not set. Which media types may be compressed is a policy value; alaa-frontend-devops decides it."
.endif

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin
  maxconn 20000

defaults static_http
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout http-keep-alive 15s
  retries 3
  option redispatch

cache static_cache
  total-max-size "${HAPROXY_CACHE_TOTAL_MB-256}"
  max-object-size "${HAPROXY_CACHE_MAX_OBJECT-262144}"
  max-age "${HAPROXY_CACHE_MAX_AGE-60}"
  # Cache one entry per Vary key rather than refusing to cache varying responses at all.
  process-vary on

frontend fe_static from static_http
  bind ":${HAPROXY_HTTP_PORT-8080}"

  # A content-hashed file: the prefix, then a name carrying at least eight hex characters.
  # Inside double quotes a bare $ starts an environment-variable reference, so the regex
  # anchor is written \$. A regex needing no expansion at all uses single quotes instead.
  acl is_hashed_asset path_reg "^${HAPROXY_ASSET_PREFIX}/.+\.[0-9a-fA-F]{8,}\.[a-z0-9]+\$"
  # A document request: no file extension in the last path segment.
  acl is_document path_reg '^[^?]*/[^./?]*$'

  # Capture the request-phase decision so the response phase can test it.
  http-request set-var(txn.hashed_asset) bool(true) if is_hashed_asset
  http-request set-var(txn.document) bool(true) if is_document

  http-request cache-use static_cache if is_hashed_asset

  # Deep-link fallback: a document path that is not a file resolves to the SPA entry, so a hard
  # refresh on a deep link returns the same document as a client-side navigation to it.
  http-request set-path /index.html if is_document

  # Policy values, supplied. This skill writes the directive; it did not choose the value.
  http-response set-header Cache-Control "${HAPROXY_HASHED_ASSET_CACHE_CONTROL}" if { var(txn.hashed_asset) -m bool }
  http-response set-header Cache-Control "${HAPROXY_HTML_CACHE_CONTROL}" if { var(txn.document) -m bool }

  default_backend be_origin

backend be_origin from static_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  http-response cache-store static_cache

  # From 3.4 the compression filter is declared explicitly as comp-res. On 3.2 and 3.3 HAProxy
  # inserts it implicitly when `compression algo` is present and no other filter is declared.
.if version_atleast(3.4)
  filter comp-res
.endif
  compression algo gzip
  # The [*] form splits the value on spaces into separate arguments. Without it the whole
  # list is passed as one media type and nothing is ever compressed.
  compression type "${HAPROXY_COMPRESS_TYPES[*]}"
  # Strip Accept-Encoding towards the origin so the origin never double-compresses.
  compression offload

  # The default is NO rewrite, because a rewrite that was not required is exactly how the
  # prefix gets stripped. Set HAPROXY_ORIGIN_EXPECTS_NO_PREFIX only when the origin has been
  # observed to serve the asset at the un-prefixed path.
.if defined(HAPROXY_ORIGIN_EXPECTS_NO_PREFIX)
  http-request replace-path "^${HAPROXY_ASSET_PREFIX}/(.*)\$" "/\1"
.endif

  server origin1 "${HAPROXY_ORIGIN-10.0.120.11:8080}" check maxconn 200 maxqueue 100
