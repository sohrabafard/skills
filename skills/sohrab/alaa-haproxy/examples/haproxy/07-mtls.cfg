# 07-mtls.cfg
# Charter: terminate client-certificate authentication at the edge.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: HAPROXY_CA_DIR holds the client CA bundle; a CRL or OCSP source must be
#   configured separately, because `verify required` proves the chain and says nothing about
#   revocation. Whether revocation checking is required here is a security decision owned by
#   /alaa-security-review ($alaa-security-review).
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_CA_DIR=/etc/haproxy/ca,
#   HAPROXY_HTTPS_PORT=443, HAPROXY_APP1=10.0.10.11:8080
# Failure mode: `verify required` rejects the handshake before any HTTP rule runs, so a client
#   with an expired certificate gets a TLS alert and no HTTP status. That is invisible in the
#   HTTP access log. Log `%[ssl_c_verify]` and `%{+Q}[ssl_c_s_dn]` on this frontend or the
#   first report will be "the site is down" with no server-side evidence. Which certificate
#   fields may be logged is decided by /alaa-security-review ($alaa-security-review) and their
#   log field names by /alaa-services-contract ($alaa-services-contract).

global
  log /dev/log local0 info

defaults mtls_edge
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  retries 3
  option redispatch

crt-store mycerts
  crt-base "${HAPROXY_CERT_DIR-/etc/haproxy/certs}"
  key-base "${HAPROXY_CERT_DIR-/etc/haproxy/certs}"
  load crt "edge.pem" alias "edge"

frontend fe_mtls from mtls_edge
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/clients-ca.pem" verify required
  ssl-f-use crt "@mycerts/edge"

  # Certificate identity for incident response. Field names come from alaa-services-contract.
  http-request set-header X-Client-DN %{+Q}[ssl_c_s_dn]
  http-request set-header X-Client-Serial %[ssl_c_serial,hex]

  # Belt and braces: `verify required` already rejects, this catches a future `verify optional`.
  http-request deny deny_status 403 unless { ssl_c_used }

  default_backend be_app

backend be_app from mtls_edge
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server app1 "${HAPROXY_APP1-10.0.10.11:8080}" check
