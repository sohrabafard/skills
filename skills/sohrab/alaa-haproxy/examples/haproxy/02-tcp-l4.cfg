# 02-tcp-l4.cfg
# Charter: pure L4 TCP proxy for a protocol HAProxy must not parse.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: the backend protocol is not HTTP, or the stream must reach the server untouched.
# Variables: HAPROXY_TCP_PORT=3306, HAPROXY_DB1=10.0.20.11:3306, HAPROXY_DB2=10.0.20.12:3306
# Failure mode: `tcp-check connect` succeeds as soon as the TCP handshake completes, so a
#   database that accepts connections but refuses authentication stays in rotation and every
#   client sees an application-level error while HAProxy reports the server up. Add a
#   protocol-aware `tcp-check send`/`tcp-check expect` pair before calling this production-ready.
# Defaults association: `tcp_l4` is named so this file can be concatenated with 01 without
#   flipping `mode` for the proxies that follow. See references/20-core-config-and-timeouts.md.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s

defaults tcp_l4
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client  1m
  timeout server  1m
  retries 3
  option redispatch

frontend fe_tcp from tcp_l4
  bind ":${HAPROXY_TCP_PORT-3306}"
  default_backend be_mysql

backend be_mysql from tcp_l4
  balance leastconn
  option tcp-check
  tcp-check connect
  server db1 "${HAPROXY_DB1-10.0.20.11:3306}" check
  server db2 "${HAPROXY_DB2-10.0.20.12:3306}" check backup
