global
  master-worker
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client  1m
  timeout server  1m

frontend fe_tcp
  bind :3306
  default_backend be_mysql

backend be_mysql
  balance leastconn
  option tcp-check
  tcp-check connect
  server db1 10.0.20.11:3306 check
  server db2 10.0.20.12:3306 check backup
