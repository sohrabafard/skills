global
  master-worker
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

frontend fe_client_tls
  bind :443 ssl crt /etc/haproxy/certs/public.pem alpn h2,http/1.1
  http-request set-header X-Request-Id %[unique-id]
  default_backend be_secure_api

backend be_secure_api
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  # Client cert authentication towards the backend service.
  server api1 10.0.110.11:443 ssl verify required ca-file /etc/haproxy/ssl/backend-ca.pem crt /etc/haproxy/client/backend-client.pem sni str(api.internal.example) check
  server api2 10.0.110.12:443 ssl verify required ca-file /etc/haproxy/ssl/backend-ca.pem crt /etc/haproxy/client/backend-client.pem sni str(api.internal.example) check
