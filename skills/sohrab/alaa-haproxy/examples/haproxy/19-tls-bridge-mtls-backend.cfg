# 19-tls-bridge-mtls-backend.cfg
# Charter: terminate client TLS at the edge and re-establish it towards the backend with a
#   client certificate, so the backend authenticates HAProxy rather than trusting the network.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: HAProxy's own client certificate at HAPROXY_CLIENT_DIR/backend-client.pem must
#   be readable by the HAProxy user and must not be world-readable. It expires: a certificate
#   that lapses takes every backend server down at once, because all of them reject the same
#   handshake. Alert on its notAfter, not on the 502 rate.
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_CA_DIR=/etc/haproxy/ca,
#   HAPROXY_CLIENT_DIR=/etc/haproxy/client, HAPROXY_HTTPS_PORT=443,
#   HAPROXY_BACKEND_SNI=api.internal.example, HAPROXY_SECURE1=10.0.110.11:443,
#   HAPROXY_SECURE2=10.0.110.12:443
# Failure mode: TLS is terminated and re-established, so the request is in cleartext inside the
#   HAProxy process. Anything that can read that process - a core dump, a debug trace, an
#   unbounded log format - can read the request body. Keep tracing bounded and never log a raw
#   Authorization header. Which fields may be logged is decided by /alaa-security-review
#   ($alaa-security-review).
#   `sni str(...)` pins the name explicitly rather than deriving it from the client's Host
#   header. That is the correct choice whenever one backend name serves many client-facing
#   names; see 16-server-tls-sni-auto-3.3.cfg for when the derived form is correct instead.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults bridge_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_client_tls from bridge_http
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1
  http-request del-header X-Request-Id
  http-request set-header X-Request-Id %[unique-id]
  default_backend be_secure_api

backend be_secure_api from bridge_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  server api1 "${HAPROXY_SECURE1-10.0.110.11:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/backend-ca.pem" crt "${HAPROXY_CLIENT_DIR-/etc/haproxy/client}/backend-client.pem" sni str("${HAPROXY_BACKEND_SNI-api.internal.example}") check
  server api2 "${HAPROXY_SECURE2-10.0.110.12:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/backend-ca.pem" crt "${HAPROXY_CLIENT_DIR-/etc/haproxy/client}/backend-client.pem" sni str("${HAPROXY_BACKEND_SNI-api.internal.example}") check
