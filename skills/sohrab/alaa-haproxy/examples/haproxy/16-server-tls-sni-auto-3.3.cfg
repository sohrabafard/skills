global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

frontend fe_https
  bind :443 ssl crt /etc/haproxy/certs/example.pem alpn h2,http/1.1
  default_backend be_tls_origins

backend be_tls_origins
  balance roundrobin
  option httpchk GET /healthz

  # HAProxy 3.3 can infer backend SNI from the Host header.
  server app1 10.0.91.11:443 ssl verify required ca-file /etc/haproxy/ssl/origin-ca.pem sni-auto check check-sni-auto
  server app2 10.0.91.12:443 ssl verify required ca-file /etc/haproxy/ssl/origin-ca.pem sni-auto check check-sni-auto
