# 16-server-tls-sni-auto-3.3.cfg
# Charter: backend TLS where the SNI sent to the origin is derived automatically from the
#   request's Host header.
# Minimum branch: 3.3 ("3.3 or later"). Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: THE BEHAVIOUR IS AUTOMATIC FROM 3.3, so `sni-auto` states it rather than
#   enabling it and `no-sni-auto` is how you turn it off. `check-sni-auto` and
#   `no-check-sni-auto` control the same thing for health checks independently.
#   Because SNI is derived from the Host header, AN ATTACKER-SUPPLIED HOST HEADER SELECTS THE
#   NAME THE ORIGIN CERTIFICATE IS VALIDATED AGAINST. This frontend therefore allow-lists Host
#   before the request can reach the backend. Without that allow-list an unexpected Host turns
#   into a backend TLS failure and a 502, and a chosen Host can be used to probe which names the
#   origin will present.
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_CA_DIR=/etc/haproxy/ca,
#   HAPROXY_HTTPS_PORT=443, HAPROXY_MAP_DIR=/etc/haproxy/maps,
#   HAPROXY_TLS_ORIGIN1=10.0.91.11:443, HAPROXY_TLS_ORIGIN2=10.0.91.12:443
# Failure mode: the failure is a 502 with a TLS handshake error in `show errors` and nothing in
#   the origin's own logs, because the handshake never completed. It appears only for the hosts
#   the origin certificate does not cover, so it looks like a partial outage rather than a
#   configuration error. Populate allowed-hosts.map with every name the origin certificate
#   actually covers and keep the two in step.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults sni_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_https from sni_http
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1

  # The Host header becomes the backend SNI. Bound it here, before it can.
  acl host_allowed req.hdr(host),lower,field(1,:),map_str("${HAPROXY_MAP_DIR-/etc/haproxy/maps}/allowed-hosts.map") -m found
  http-request deny deny_status 421 unless host_allowed

  default_backend be_tls_origins

backend be_tls_origins from sni_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  server app1 "${HAPROXY_TLS_ORIGIN1-10.0.91.11:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem" sni-auto check check-sni-auto
  server app2 "${HAPROXY_TLS_ORIGIN2-10.0.91.12:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem" sni-auto check check-sni-auto
