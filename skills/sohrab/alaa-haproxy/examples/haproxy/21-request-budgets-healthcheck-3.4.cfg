# Charter: route-specific connect/queue budgets with a reusable application health check.
# Minimum branch: 3.4.
# Preconditions: timeout values are approved workload budgets; check endpoint is unauthenticated
#   readiness, not just TCP acceptance. Values below are isolated example inputs, not tuning advice.
# Variables: HAPROXY_HTTP_PORT=8080, HAPROXY_APP1=127.0.0.1:8081,
#   HAPROXY_CHECK_HOST=app.internal.example, HAPROXY_CONNECT_BUDGET=1s, HAPROXY_QUEUE_BUDGET=2s.
# Failure mode: a failed readiness check removes the server; queue expiry returns an error.
#   A parser pass does not prove effective timeout values after backend switching or readiness.

defaults budgets_http
  mode http
  timeout client 30s
  timeout server 30s
  timeout connect 5s
  timeout queue 5s

healthcheck application_ready
  type httpchk
  http-check connect
  http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host "${HAPROXY_CHECK_HOST-app.internal.example}"
  http-check expect status 200

frontend fe_budgets from budgets_http
  bind ":${HAPROXY_HTTP_PORT-8080}"
  default_backend be_budgets

backend be_budgets from budgets_http
  balance roundrobin
  http-request set-timeout connect "${HAPROXY_CONNECT_BUDGET-1s}" if { path_beg /interactive/ }
  http-request set-timeout queue "${HAPROXY_QUEUE_BUDGET-2s}" if { path_beg /interactive/ }
  server application "${HAPROXY_APP1-127.0.0.1:8081}" check healthcheck application_ready
