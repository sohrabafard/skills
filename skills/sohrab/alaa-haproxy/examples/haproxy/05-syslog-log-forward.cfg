# 05-syslog-log-forward.cfg
# Charter: relay syslog from other producers through HAProxy to a pair of collectors.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: binding 514 needs either root, CAP_NET_BIND_SERVICE, or a high port plus a
#   port mapping. Which of those a container uses is decided by /alaa-docker-production
#   ($alaa-docker-production) and /alaa-k8s-helm ($alaa-k8s-helm), not here.
#   The field names carried in these records are decided by /alaa-services-contract
#   ($alaa-services-contract); this file only moves the bytes.
# Variables: HAPROXY_SYSLOG_PORT=514, HAPROXY_SYSLOG1=10.0.40.11:514, HAPROXY_SYSLOG2=10.0.40.12:514
# Failure mode: `option dont-parse-log` forwards the record unmodified, so a malformed producer
#   is relayed rather than rejected and the collector, not HAProxy, is where the parse failure
#   surfaces. UDP delivery to the collectors is unacknowledged: a collector that is down loses
#   every record for the duration with nothing in HAProxy's own logs. If loss is unacceptable,
#   the requirement is a queue, not a log forwarder, and it goes to /alaa-async-messaging
#   ($alaa-async-messaging).
# Defaults association: this file declares no `defaults` section, so nothing here is governed
#   positionally and nothing here governs a proxy in a file concatenated after it.

global
  log /dev/log local0 info

log-forward lf_syslog
  bind ":${HAPROXY_SYSLOG_PORT-514}"
  dgram-bind ":${HAPROXY_SYSLOG_PORT-514}"
  option dont-parse-log
  option assume-rfc6587-ntf
  log backend@be_syslog local0

backend be_syslog
  mode log
  balance roundrobin
  server sys1 "udp@${HAPROXY_SYSLOG1-10.0.40.11:514}"
  server sys2 "udp@${HAPROXY_SYSLOG2-10.0.40.12:514}"
