# 03-quic-http3.cfg
# Charter: frontend HTTP/3 over QUIC alongside an HTTP/2 and HTTP/1.1 TCP listener.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: the running binary must report QUIC. Run `haproxy -vv` and look for
#   `OPT_QUIC` / `USE_QUIC=1` in the build options and a QUIC-capable TLS stack in the
#   `Built with OpenSSL version` line. Full QUIC needs quictls, AWS-LC or WolfSSL; stock
#   OpenSSL 3.x needs `limited-quic` and loses 0-RTT. See references/30-quic-http3.md for the
#   matrix and for what to do when `haproxy -vv` reports no QUIC.
#   UDP on the QUIC port must be reachable end to end; a firewall that passes TCP 443 and
#   drops UDP 443 is the most common cause of a silent fallback to HTTP/2.
# Requires-build: QUIC
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_HTTPS_PORT=443,
#   HAPROXY_APP1=10.0.10.11:8080, HAPROXY_APP2=10.0.10.12:8080
# Failure mode: with no QUIC in the build the process exits at startup and `haproxy -c -f`
#   reports the unsupported address family. With QUIC present but UDP blocked in the network,
#   HAProxy starts, `haproxy -c -f` passes, and every client silently uses HTTP/2 while the
#   HTTP/3 rollout is reported as complete. Confirm from the `alpn` field in the access log,
#   not from the config.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s

  # A build made against stock OpenSSL exposes only the compatibility layer, and the QUIC bind
  # below is rejected without this option. On a build with a real QUIC API the option is not
  # needed and this block is not taken. `limited-quic` costs 0-RTT resumption.
.if feature(QUIC_OPENSSL_COMPAT)
  limited-quic
.endif

  # No `tune.quic.*` line here on purpose: the namespace was reorganised in 3.3 and again in
  # 3.4, so any name written for one branch is a startup error on another. Enumerate the names
  # your binary actually has with:
  #   haproxy -dKcfg -c -f /dev/null | grep tune.quic
  # and see references/30-quic-http3.md before adding one.

defaults quic_edge
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  retries 3
  option redispatch

crt-store mycerts
  crt-base "${HAPROXY_CERT_DIR-/etc/haproxy/certs}"
  key-base "${HAPROXY_CERT_DIR-/etc/haproxy/certs}"
  load crt "edge.pem" alias "edge"

frontend fe_h3 from quic_edge
  # TCP listener carries the h2 and http/1.1 fallback. Keep it: HTTP/3 is advertised, never required.
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl alpn h2,http/1.1
  bind "quic4@:${HAPROXY_HTTPS_PORT-443}" ssl alpn h3
  ssl-f-use crt "@mycerts/edge" ssl-min-ver TLSv1.2

  # Tell clients HTTP/3 exists. Without this most clients never try the UDP listener.
  http-response set-header Alt-Svc "h3=\":${HAPROXY_HTTPS_PORT-443}\"; ma=86400"

  default_backend be_app

backend be_app from quic_edge
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server app1 "${HAPROXY_APP1-10.0.10.11:8080}" check
  server app2 "${HAPROXY_APP2-10.0.10.12:8080}" check
