# 06-dns-service-discovery.cfg
# Charter: resolver-driven backend discovery with `server-template`, for backends whose
#   addresses change without a config change.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: the nameserver address must be reachable from the HAProxy pod or host, and
#   the record must return at least as many addresses as the template's upper bound or the
#   surplus slots stay in maintenance.
# Variables: HAPROXY_HTTP_PORT=8080, HAPROXY_DNS=10.96.0.10:53, HAPROXY_SERVICE_FQDN=myapp.default.svc.cluster.local,
#   HAPROXY_SERVICE_PORT=8080, HAPROXY_TEMPLATE_MAX=3
# Failure mode: `hold valid 10s` re-resolves every ten seconds, so a service whose endpoints
#   churn faster than that flaps servers in and out of rotation; each flap drains the server's
#   connections and shows up as a 503 burst, not as a DNS error. Raise `hold valid` before
#   raising `resolve_retries`. `init-addr none` lets HAProxy start with the name unresolved,
#   which is what keeps a DNS outage from blocking a rollout - and also what lets a permanently
#   wrong FQDN start cleanly and serve nothing. Confirm with `show servers state` after start.

global
  log /dev/log local0 info

defaults dyn_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  retries 3
  option redispatch

resolvers dns
  nameserver dns1 "${HAPROXY_DNS-10.96.0.10:53}"
  resolve_retries 3
  timeout resolve 1s
  timeout retry   1s
  hold valid      10s

frontend fe_dynamic from dyn_http
  bind ":${HAPROXY_HTTP_PORT-8080}"
  default_backend be_dynamic

backend be_dynamic from dyn_http
  balance roundrobin
  default-server init-addr none resolvers dns resolve-prefer ipv4 check
  server-template srv 1-3 "${HAPROXY_SERVICE_FQDN-myapp.default.svc.cluster.local}:${HAPROXY_SERVICE_PORT-8080}"
