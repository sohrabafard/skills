# 15-persistent-stats-3.3.cfg
# Charter: counters that survive a reload, so a dashboard does not reset every time the config
#   changes.
# Minimum branch: 3.3 ("3.3 or later"). Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: on 3.3, `expose-experimental-directives` must precede `shm-stats-file`. From
#   3.4 `shm-stats-file` is no longer experimental and the option warns that it is unused, so
#   the gate below is behind a version test rather than written unconditionally. Verified
#   against 3.4.0 on 2026-07-29. The
#   `shm-stats-file` path MUST BE WRITABLE by the HAProxy user. Under
#   `readOnlyRootFilesystem: true` that means an explicit writable mount at that path -
#   examples/kubernetes/haproxy-deployment.yaml mounts /dev/shm for exactly this reason.
#   Every `guid` must be unique across the whole config; a duplicate is a startup error.
# Variables: HAPROXY_SHM_STATS=/dev/shm/haproxy-stats, HAPROXY_HTTP_PORT=80,
#   HAPROXY_WEB1=172.16.0.12:80
# Failure mode: stats survive a RELOAD; they do not survive a RESTART, and they do not survive
#   the shared-memory file being removed. A dashboard built on the assumption of continuity will
#   still show a discontinuity after a node restart, and that discontinuity is indistinguishable
#   from a traffic drop unless the panel is annotated. `show stat typed` reports whether each
#   metric is volatile or persistent; use it to confirm the rollout rather than inferring it
#   from a graph. Whether the continuity is required at all is decided by
#   /alaa-observability-soc ($alaa-observability-soc).
#   A `guid` is a durable identifier: changing one renames the series and breaks history exactly
#   as if the counter had reset. Treat a guid change as a dashboard migration.

global
.if !version_atleast(3.4)
  expose-experimental-directives
.endif
  shm-stats-file "${HAPROXY_SHM_STATS-/dev/shm/haproxy-stats}"
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults stats_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_http from stats_http
  guid a88e2a95-547e-47f1-b406-ea82ea47abcc
  bind ":${HAPROXY_HTTP_PORT-80}"
  default_backend be_web

backend be_web from stats_http
  guid 3db38dc1-4aa8-4172-b7de-affb7f1f51a8
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server web1 "${HAPROXY_WEB1-172.16.0.12:80}" check maxconn 30 guid 775e29c2-0b97-4f19-9976-dba604b833f4
