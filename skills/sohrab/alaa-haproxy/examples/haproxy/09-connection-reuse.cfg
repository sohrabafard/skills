# 09-connection-reuse.cfg
# Charter: backend connection reuse and idle-connection liveness.
# Minimum branch: 3.2 (`idle-ping` is a 3.2 keyword). Verified against 3.4.2 on 2026-07-29
#   with `haproxy -c -f`.
# Preconditions: `idle-ping` is a `bind` argument and a `server` argument. It is NOT a
#   proxy-level directive; a bare `idle-ping 30s` line inside a `frontend` section is a parse
#   error ("unknown keyword 'idle-ping'"). Only the HTTP/2 multiplexer implements it, so it has
#   no effect on an HTTP/1.1 connection.
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_HTTPS_PORT=443,
#   HAPROXY_ORIGIN=10.0.130.11:443, HAPROXY_ORIGIN_SNI=origin.internal,
#   HAPROXY_CA_DIR=/etc/haproxy/ca, HAPROXY_IDLE_PING=30s
# Failure mode: an idle pooled connection that the origin or a middlebox has already dropped is
#   selected for the next request and that request fails once. With `option redispatch` and
#   `retries` set the retry succeeds and the only evidence is a rise in `wretr` in `show stat`.
#   `idle-ping` closes such a connection before it is reused. In the other direction, reuse
#   makes HAProxy hold idle sockets against every origin: multiply `pool-max-conn` by the
#   server count before assuming the file-descriptor ceiling is generous.
#   From 3.3, `http-send-name-header` may no longer overwrite `connection`, `content-length`,
#   `host` or `transfer-encoding`; a config that relied on that is a startup error after upgrade.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults reuse_http
  log global
  mode http
  option httplog

  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  timeout http-keep-alive 30s
  retries 3
  option redispatch

frontend fe_h2 from reuse_http
  # idle-ping belongs on the bind line, not on a line of its own.
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1 idle-ping "${HAPROXY_IDLE_PING-30s}"
  default_backend be_pool

backend be_pool from reuse_http
  balance roundrobin
  option http-keep-alive
  http-reuse safe
  option httpchk GET /healthz
  http-check expect status 200

  http-send-name-header X-HAProxy-Server

  server o1 "${HAPROXY_ORIGIN-10.0.130.11:443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/origin-ca.pem" sni str("${HAPROXY_ORIGIN_SNI-origin.internal}") check pool-max-conn 100 idle-ping "${HAPROXY_IDLE_PING-30s}"
