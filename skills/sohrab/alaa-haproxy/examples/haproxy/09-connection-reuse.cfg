global
  master-worker
  log /dev/log local0 info

defaults
  log global
  mode http
  option httplog

  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  timeout http-keep-alive 30s

frontend fe_h2
  bind :443 ssl alpn h2,http/1.1
  # H2-only liveness on idle connections (only H2 mux implements idle-ping)
  idle-ping 30s

  default_backend be_pool

backend be_pool
  # Keepalive provides best throughput; be aware of idle conns
  option http-keep-alive

  # Helpful for tracing: add selected server name to a header
  http-send-name-header X-HAProxy-Server

  # If you need SNI-based pooling controls, you can control pool key:
  # pool-conn-name %[ssl_bc_sni]
  server o1 origin.internal:443 ssl verify none sni str(origin.internal) check
