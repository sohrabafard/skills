# 04-rate-limit-stick-table.cfg
# Charter: single-node request-rate damper with an escalating penalty counter.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: THE KEY MUST MATCH THE TRUST BOUNDARY. `src` is the client address only on a
#   listener that untrusted clients reach directly. Behind a PROXY-protocol load balancer this
#   frontend needs `accept-proxy` on its `bind` line AND a network control that makes the
#   listener unreachable from anything but that load balancer, because the PROXY header is an
#   unauthenticated source-address assertion HAProxy trusts unconditionally. Behind an
#   X-Forwarded-For load balancer the key is the right-most untrusted hop, never
#   `req.hdr(x-forwarded-for)` unqualified. See references/40-rate-limiting-and-peers.md.
# Variables: HAPROXY_HTTP_PORT=8080, HAPROXY_RATE_LIMIT_RPS=200, HAPROXY_PENALTY_THRESHOLD=10,
#   HAPROXY_TABLE_SIZE=200k, HAPROXY_FRONTEND_MAXCONN=20000,
#   HAPROXY_API1=10.0.30.11:8080, HAPROXY_API2=10.0.30.12:8080
# Failure mode: deployed behind a load balancer without `accept-proxy`, every client collapses
#   into one table entry per load-balancer address, and the first such address to exceed
#   HAPROXY_RATE_LIMIT_RPS returns 429 to everyone behind it - a self-inflicted outage that
#   fires precisely under load. Deployed with `accept-proxy` on a listener untrusted clients can
#   reach, a client forges a fresh source address per request and the limiter never triggers.
#   At `${HAPROXY_TABLE_SIZE}` entries the table evicts the least recently used entry, which is
#   the attacker you were tracking if the attacker has gone quiet for a moment. Size the table
#   for the peak number of distinct keys, not for the peak request rate.
# This file limits one node only. For the multi-node arithmetic see 12-peers-global-rate-limit.cfg.

global
  log /dev/log local0 info
  # A limiter with no connection ceiling can be exhausted before any rule runs.
  maxconn 40000

defaults api_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_api from api_http
  bind ":${HAPROXY_HTTP_PORT-8080}"
  maxconn "${HAPROXY_FRONTEND_MAXCONN-20000}"

  stick-table type ip size "${HAPROXY_TABLE_SIZE-200k}" expire 10m store http_req_rate(10s),gpc0
  http-request track-sc0 src

  acl too_fast sc_http_req_rate(0) gt "${HAPROXY_RATE_LIMIT_RPS-200}"
  http-request sc-inc-gpc0(0) if too_fast

  # Reject over the limit. `http-request pause` is NOT used here: pausing holds the stream and
  # its buffers instead of releasing them, so under a connection-exhaustion flood it amplifies
  # the pressure it was added to relieve. Use `pause` only against a client that is already
  # rate-limited by its own concurrency, never as the first response to a flood.
  http-request deny deny_status 429 if too_fast

  # Repeat offenders are denied for the life of the table entry, not just for the burst.
  acl blocked sc_get_gpc0(0) ge "${HAPROXY_PENALTY_THRESHOLD-10}"
  http-request deny deny_status 429 if blocked

  default_backend be_api

backend be_api from api_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server api1 "${HAPROXY_API1-10.0.30.11:8080}" check
  server api2 "${HAPROXY_API2-10.0.30.12:8080}" check
