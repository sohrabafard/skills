# 01-baseline-http-tls.cfg
# Charter: HTTP and TLS edge baseline. Copy this first for any new HAProxy frontend.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: HAPROXY_CERT_DIR holds edge.pem (certificate chain plus private key);
#   /run/haproxy exists and is writable by the haproxy user; the process is started with
#   `haproxy -W -db -f <this file>` (the `master-worker` global directive is deprecated from 3.3).
# Variables: HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_HTTP_PORT=80, HAPROXY_HTTPS_PORT=443,
#   HAPROXY_APP1=10.0.10.11:8080, HAPROXY_APP2=10.0.10.12:8080, HAPROXY_SERVER_MAXCONN=200
# Failure mode: if `option redispatch` is removed, all three `retries` are sent to the same
#   failed server and the client sees a 503 that the health check has already explained;
#   if `edge.pem` is missing HAProxy refuses to start and `haproxy -c -f` reports the stat failure.
# Defaults association: every proxy below names its defaults with `from`. See
#   references/20-core-config-and-timeouts.md before concatenating this file with another.

global
  log /dev/log local0 info
  user haproxy
  group haproxy
  chroot /var/lib/haproxy
  # The socket is created before the chroot takes effect, so this path is outside the chroot.
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s

  maxconn 50000

  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
  ssl-default-bind-ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256

defaults http_edge
  log global
  mode http
  option httplog
  option dontlognull

  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  timeout http-keep-alive 30s

  # `retries` without `option redispatch` retries the same failed server every time.
  retries 3
  option redispatch
  option forwardfor

crt-store mycerts
  crt-base "${HAPROXY_CERT_DIR-/etc/haproxy/certs}"
  key-base "${HAPROXY_CERT_DIR-/etc/haproxy/certs}"
  load crt "edge.pem" alias "edge"

frontend fe_http_https from http_edge
  bind ":${HAPROXY_HTTP_PORT-80}"
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl label public_https

  ssl-f-use crt "@mycerts/edge" ssl-min-ver TLSv1.2 alpn h2,http/1.1

  http-request redirect scheme https code 301 unless { ssl_fc }

  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-request set-header X-Request-Id %[unique-id]

  default_backend be_app

backend be_app from http_edge
  # From 3.3 the default algorithm is `random` when `balance` is absent. State it.
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  server app1 "${HAPROXY_APP1-10.0.10.11:8080}" check maxconn "${HAPROXY_SERVER_MAXCONN-200}" strict-maxconn
  server app2 "${HAPROXY_APP2-10.0.10.12:8080}" check maxconn "${HAPROXY_SERVER_MAXCONN-200}" strict-maxconn
