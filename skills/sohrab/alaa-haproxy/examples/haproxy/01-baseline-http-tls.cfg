global
  master-worker
  log /dev/log local0 info
  user haproxy
  group haproxy
  chroot /var/lib/haproxy
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s

  # Bounds
  maxconn 50000

  # TLS defaults (adjust for your policy)
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
  ssl-default-bind-ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256

defaults
  log global
  mode http
  option httplog
  option dontlognull

  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s
  timeout http-keep-alive 30s

  retries 3
  option forwardfor

crt-store mycerts
  crt-base /etc/haproxy/certs/
  key-base /etc/haproxy/certs/
  load crt "example.com.pem" alias "example"

frontend fe_http_https
  bind :80
  bind :443 ssl label public_https

  # HAProxy 3.2: attach cert and policy via ssl-f-use
  ssl-f-use crt "@mycerts/example" ssl-min-ver TLSv1.2 alpn h2,http/1.1

  # Redirect to HTTPS
  http-request redirect scheme https code 301 unless { ssl_fc }

  # Headers for apps
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-request set-header X-Request-Id %[unique-id]

  default_backend be_app

backend be_app
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200

  server app1 10.0.10.11:8080 check maxconn 200 strict-maxconn
  server app2 10.0.10.12:8080 check maxconn 200 strict-maxconn
