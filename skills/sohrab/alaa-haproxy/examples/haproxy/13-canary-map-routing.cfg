# 13-canary-map-routing.cfg
# Charter: map-driven canary routing, so a release step is a one-line diff in a data file
#   rather than a config change.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: the map file must exist at startup or HAProxy refuses to start. It is loaded
#   into memory at start and is NOT re-read when the file changes; a live change is applied with
#   `add map`/`del map`/`set map` on the Runtime API, and a Runtime API change is lost on the
#   next restart unless the file is updated too. Keep both in step or a restart silently
#   reverts the rollout.
#   Whether a canary step is allowed to proceed, and on what evidence, is change control and is
#   decided by /alaa-controlled-ops ($alaa-controlled-ops).
# Variables: HAPROXY_HTTP_PORT=80, HAPROXY_MAP_DIR=/etc/haproxy/maps,
#   HAPROXY_WEB1=10.0.80.11:8080, HAPROXY_WEB2=10.0.80.12:8080, HAPROXY_CANARY1=10.0.80.21:8080
# Failure mode: a map lookup is a hash lookup and stays constant-time as the file grows, which
#   is why this scales where a chain of ACLs does not. But `map_beg` matches on a prefix, so an
#   entry of `/` routes everything to the canary. Rolling back means editing the file AND
#   issuing `del map`; doing only one of the two leaves the two sources disagreeing, and which
#   one wins depends on whether the process has restarted since.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults canary_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

frontend fe_web from canary_http
  bind ":${HAPROXY_HTTP_PORT-80}"

  acl use_canary path,map_beg("${HAPROXY_MAP_DIR-/etc/haproxy/maps}/canary-paths.map") -m found
  use_backend be_canary if use_canary

  default_backend be_stable

backend be_stable from canary_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  http-response set-header X-Release-Track stable
  server web1 "${HAPROXY_WEB1-10.0.80.11:8080}" check
  server web2 "${HAPROXY_WEB2-10.0.80.12:8080}" check

backend be_canary from canary_http
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  http-response set-header X-Release-Track canary
  server canary1 "${HAPROXY_CANARY1-10.0.80.21:8080}" check
