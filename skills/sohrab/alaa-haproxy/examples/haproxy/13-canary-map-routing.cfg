global
  master-worker
  log /dev/log local0 info

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

frontend fe_web
  bind :80

  # Small reviewable diffs in the map file can steer host- or path-based canaries.
  acl use_canary path,map_beg(/etc/haproxy/maps/canary-paths.map) -m found
  use_backend be_canary if use_canary

  default_backend be_stable

backend be_stable
  balance roundrobin
  option httpchk GET /healthz
  server web1 10.0.80.11:8080 check
  server web2 10.0.80.12:8080 check

backend be_canary
  balance roundrobin
  option httpchk GET /healthz
  http-response set-header X-Release-Track canary
  server canary1 10.0.80.21:8080 check
