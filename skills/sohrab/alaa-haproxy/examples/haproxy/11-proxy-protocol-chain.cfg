global
  master-worker
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

# Upstream cloud load balancer sends PROXY protocol.
frontend fe_edge_from_lb
  bind :443 ssl accept-proxy crt /etc/haproxy/certs/example.pem alpn h2,http/1.1
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  default_backend be_internal_gateway

backend be_internal_gateway
  balance roundrobin
  option httpchk GET /readyz

  # Downstream service explicitly expects PROXY protocol as well.
  server gw1 10.0.60.11:8443 ssl verify none send-proxy-v2 check
  server gw2 10.0.60.12:8443 ssl verify none send-proxy-v2 check
