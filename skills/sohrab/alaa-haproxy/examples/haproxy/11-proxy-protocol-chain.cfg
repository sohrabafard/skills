# 11-proxy-protocol-chain.cfg
# Charter: HAProxy behind an upstream load balancer that speaks PROXY protocol, forwarding to a
#   downstream that expects it too.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
# Preconditions: `accept-proxy` makes HAProxy REQUIRE a PROXY header on every connection and
#   trust its source address unconditionally. The header is unauthenticated. A listener carrying
#   `accept-proxy` must be unreachable from anything but the specific upstream that sends it,
#   enforced in a NetworkPolicy, a security group or a firewall - not in this file. Whether that
#   control is adequate is decided by /alaa-security-review ($alaa-security-review).
#   A client that reaches this listener directly is rejected for the missing header; a client
#   that reaches it and speaks PROXY protocol chooses its own source address.
# Variables: HAPROXY_HTTPS_PORT=443, HAPROXY_CERT_DIR=/etc/haproxy/certs,
#   HAPROXY_CA_DIR=/etc/haproxy/ca, HAPROXY_GW1=10.0.60.11:8443, HAPROXY_GW2=10.0.60.12:8443
# Failure mode: with `accept-proxy` set and the upstream not sending the header, every
#   connection is dropped during the handshake and the access log shows no request at all -
#   the symptom is "the site is down", the evidence is in `show errors`. With the upstream
#   sending the header and `accept-proxy` absent, HAProxy parses the PROXY line as the first
#   HTTP request line and returns 400 to everything. Both directions pass `haproxy -c -f`.

global
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults chain_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch
  # `src` here is the address the upstream asserted, which is what forwardfor must carry.
  option forwardfor

frontend fe_edge_from_lb from chain_http
  bind ":${HAPROXY_HTTPS_PORT-443}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/edge.pem" alpn h2,http/1.1 accept-proxy
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  default_backend be_internal_gateway

backend be_internal_gateway from chain_http
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200

  server gw1 "${HAPROXY_GW1-10.0.60.11:8443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/internal-ca.pem" send-proxy-v2 check
  server gw2 "${HAPROXY_GW2-10.0.60.12:8443}" ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/internal-ca.pem" send-proxy-v2 check
