global
  master-worker
  log /dev/log local0 info

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

peers abuse_cluster
  peer edge-a 10.0.70.11:1024
  peer edge-b 10.0.70.12:1024

frontend fe_api
  bind :8080
  stick-table type ip size 500k expire 30m peers abuse_cluster store http_req_rate(10s),conn_rate(10s),gpc0
  http-request track-sc0 src

  acl burst sc_http_req_rate(0) gt 150
  acl noisy_client sc_conn_rate(0) gt 50
  http-request sc-inc-gpc0(0) if burst || noisy_client

  acl blocked sc_get_gpc0(0) ge 5
  http-request pause 150ms if burst !blocked
  http-request deny deny_status 429 if blocked

  default_backend be_api

backend be_api
  balance leastconn
  option httpchk GET /healthz
  server api1 10.0.70.21:8080 check maxconn 300 strict-maxconn
  server api2 10.0.70.22:8080 check maxconn 300 strict-maxconn
