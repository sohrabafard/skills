# 12-peers-global-rate-limit.cfg
# Charter: a stick table replicated across edge nodes with `peers`, used as a multi-node abuse
#   damper. Read this header before copying: this is NOT a global quota.
# Minimum branch: 3.2. Verified against 3.4.2 on 2026-07-29 with `haproxy -c -f`.
#
# Preconditions, all three of which fail silently when unmet:
#  1. THE LOCAL PEER MUST BE IDENTIFIABLE. HAProxy activates a `peers` section only when one of
#     its `server` entries matches the local peer name. That name is the machine hostname by
#     default and is set explicitly by the `localpeer` keyword in `global` or by the `-L` command
#     line option. With Kubernetes-generated pod names no entry ever matches, and when no entry
#     matches HAProxy does not activate the section: it neither dials out nor listens. The
#     config still passes `haproxy -c -f`, HAProxy still starts, the table is still created, and
#     the limit still works - per node, in isolation, with nothing in the logs. Set `localpeer`
#     from the downward API or pass `-L "$(hostname)"` and give every node an entry.
#  2. THE TABLE IDENTITY MUST MATCH ON EVERY NODE. Peers replicate a table by name, `type` and
#     `size`. A node upgraded to `size 1m` while its partner stays at `500k` has the table
#     refused for sync while everything else runs normally. Declaring the table inside the
#     `peers` section, as below, makes the shared identity a single reviewable line.
#  3. THE PEERS PORT MUST BE AUTHENTICATED. The peers protocol carries no authentication of its
#     own. Anything that can reach this port can write stick-table entries: push `gpc0` above
#     the deny threshold for a chosen victim, or push a counter down to evade the limit
#     entirely. Both `bind` and every remote `server` below use TLS with mutual verification,
#     and the port must additionally be restricted to the peer set at the network layer.
#
# Variables: HAPROXY_LOCALPEER=edge-a, HAPROXY_PEERS_PORT=1024, HAPROXY_PEER_B=10.0.70.12:1024,
#   HAPROXY_CERT_DIR=/etc/haproxy/certs, HAPROXY_CA_DIR=/etc/haproxy/ca,
#   HAPROXY_HTTP_PORT=8080, HAPROXY_TABLE_SIZE=500k, HAPROXY_NODE_COUNT=2,
#   HAPROXY_PER_NODE_RPS=75, HAPROXY_PENALTY_THRESHOLD=5,
#   HAPROXY_API1=10.0.70.21:8080, HAPROXY_API2=10.0.70.22:8080
#
# Failure mode - the arithmetic this file exists to state:
#   Peers REPLICATE entries, they do not SUM them. A receiving peer applies the value it was
#   sent to its local entry; there is no aggregation step. So the threshold below is per node,
#   and the cluster admits up to HAPROXY_PER_NODE_RPS * HAPROXY_NODE_COUNT.
#   HAPROXY_PER_NODE_RPS is therefore set to global_budget / node_count: 150 / 2 = 75.
#   WHEN A PEER IS UNREACHABLE THE LIMIT FAILS OPEN BY EXACTLY THE NODE COUNT. Each node keeps
#   counting only the traffic it sees, so a client spreading requests across two nodes is
#   measured at roughly half its true rate on each and the admitted total rises toward
#   2 x 150 = 300 req/s while every node believes it is enforcing 150. On three nodes it is 450.
#   Nothing in the config, the access log or the metrics reports this. The one command that
#   shows it is `show peers` on the Runtime API: a healthy remote entry reads `(remote,active)`
#   and a dead one does not. Alert on that, not on the request rate.
#   On reconnect there is no catch-up: peers exchange current entry state, not a journal, so
#   requests admitted during the partition are gone from the counters. In the other direction,
#   `expire 30m` outlives the 10s measurement window, so a stale `gpc0` replicated from a
#   recovering peer can re-block a client that has behaved for twenty minutes.
#   THIS IS A DAMPER, NOT A QUOTA. If the requirement is a hard global quota, open-source
#   HAProxy peers cannot provide it and the requirement goes to /alaa-system-design
#   ($alaa-system-design) for a design with a shared counter store.
#   Whether the correct response to a peer outage is to fail open or fail closed is not decided
#   here. Ask: when this dependency cannot answer, does proceeding without it let something
#   through that must not get through? If the limiter is protecting a backend from overload the
#   answer is availability and /alaa-reliability-sla ($alaa-reliability-sla) decides. If it is
#   the only control in front of a credential endpoint the answer is yes and
#   /alaa-security-review ($alaa-security-review) decides.
#
# Key selection: see the trust-boundary block in 04-rate-limit-stick-table.cfg. It applies
#   unchanged here and is stated once, there.

global
  log /dev/log local0 info
  # Without this the local peer is the hostname, which no `server` entry below will match.
  localpeer "${HAPROXY_LOCALPEER-edge-a}"
  maxconn 40000

defaults peer_http
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  retries 3
  option redispatch

peers abuse_cluster
  bind ":${HAPROXY_PEERS_PORT-1024}" ssl crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/peers.pem" ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/peers-ca.pem" verify required
  default-server ssl verify required ca-file "${HAPROXY_CA_DIR-/etc/haproxy/ca}/peers-ca.pem" crt "${HAPROXY_CERT_DIR-/etc/haproxy/certs}/peers.pem"

  # The local entry carries no address: it is served by the `bind` line above.
  server edge-a
  server edge-b "${HAPROXY_PEER_B-10.0.70.12:1024}"

  # One shared identity, identical on every node.
  table abuse type ip size "${HAPROXY_TABLE_SIZE-500k}" expire 30m store http_req_rate(10s),conn_rate(10s),gpc0

frontend fe_api from peer_http
  bind ":${HAPROXY_HTTP_PORT-8080}"
  http-request track-sc0 src table abuse_cluster/abuse

  # Per node. Cluster admits this multiplied by HAPROXY_NODE_COUNT. See the header.
  acl burst sc_http_req_rate(0) gt "${HAPROXY_PER_NODE_RPS-75}"
  http-request sc-inc-gpc0(0) if burst

  acl blocked sc_get_gpc0(0) ge "${HAPROXY_PENALTY_THRESHOLD-5}"
  http-request deny deny_status 429 if burst
  http-request deny deny_status 429 if blocked

  default_backend be_api

backend be_api from peer_http
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  server api1 "${HAPROXY_API1-10.0.70.21:8080}" check maxconn 300 strict-maxconn maxqueue 100
  server api2 "${HAPROXY_API2-10.0.70.22:8080}" check maxconn 300 strict-maxconn maxqueue 100
