# More opinionated production-oriented values patterns.
# Adjust key names to the actual chart you use.

image:
  repository: haproxy
  tag: "3.2.15"
  pullPolicy: IfNotPresent

replicaCount: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

args:
  - -W
  - -db
  - -f
  - /usr/local/etc/haproxy/haproxy.cfg

service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    service.beta.kubernetes.io/example: "replace-me"
  ports:
    http: 80
    https: 443
  metrics:
    enabled: true
    port: 8405

config:
  existingConfigMap: haproxy-config

tls:
  existingSecret: haproxy-certs

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 2Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: haproxy

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: haproxy

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 99
  runAsGroup: 99
  fsGroup: 99

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

extraVolumes:
  - name: run
    emptyDir: {}
  - name: lib
    emptyDir: {}

extraVolumeMounts:
  - name: run
    mountPath: /run/haproxy
  - name: lib
    mountPath: /var/lib/haproxy

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -ec
        - kill -USR1 1 || true; sleep 20
