# Example values.yaml patterns (adapt to your chart)
image:
  repository: haproxy
  tag: "3.2"

service:
  type: LoadBalancer
  ports:
    http: 80

config:
  # You typically mount a ConfigMap/Secret, or embed config depending on chart
  existingConfigMap: haproxy-config

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi
