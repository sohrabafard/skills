apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
data:
  haproxy.cfg: |
    # Mount your chosen example config here.
    # Example path in official image: /usr/local/etc/haproxy/haproxy.cfg
    # Validate before deploy: haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
    global
      master-worker
      log stdout format raw local0 info
    defaults
      log global
      mode http
      option httplog
      timeout connect 5s
      timeout client 30s
      timeout server 30s
    frontend fe
      bind :8080
      default_backend be
    backend be
      server s1 127.0.0.1:8080
