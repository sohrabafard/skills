apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
      annotations:
        # Recommended: add a checksum annotation in Helm to trigger rollout on config changes
        # checksum/haproxy-config: "<sha256>"
        {}
    spec:
      containers:
      - name: haproxy
        image: haproxy:3.2
        args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: cfg
          mountPath: /usr/local/etc/haproxy
          readOnly: true
      volumes:
      - name: cfg
        configMap:
          name: haproxy-config
