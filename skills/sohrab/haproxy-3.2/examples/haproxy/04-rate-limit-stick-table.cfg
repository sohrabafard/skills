global
  master-worker
  log /dev/log local0 info

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s

frontend fe_api
  bind :8080

  # Track per-IP request rate over 10s
  stick-table type ip size 200k expire 10m store http_req_rate(10s),gpc0
  http-request track-sc0 src

  # If too fast, increment penalty counter
  acl too_fast sc_http_req_rate(0) gt 200
  http-request sc-inc-gpc0(0) if too_fast

  # Option A: slow down (HAProxy 3.2 pause action)
  http-request pause 200ms if too_fast

  # Option B: block hard if repeated
  acl blocked sc_get_gpc0(0) ge 10
  http-request deny deny_status 429 if blocked

  default_backend be_api

backend be_api
  balance roundrobin
  server api1 10.0.30.11:8080 check
  server api2 10.0.30.12:8080 check
