global
  master-worker
  log /dev/log local0 info
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s

  # QUIC tuning (adjust)
  tune.quic.frontend.stream-data-ratio 90
  tune.quic.frontend.max-tx-mem 512m

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout http-request 10s

crt-store mycerts
  crt-base /etc/haproxy/certs/
  key-base /etc/haproxy/certs/
  load crt "example.com.pem" alias "example"

# QUIC listener uses quic4@ prefix (per config manual examples)
listen h3_quic_proxy
  bind quic4@:443 ssl
  ssl-f-use crt "@mycerts/example"
  # optional: alpn h3 (QUIC defaults to h3)
  # bind quic4@:443 ssl alpn h3

  default_backend be_app

backend be_app
  balance roundrobin
  server app1 10.0.10.11:8080 check
  server app2 10.0.10.12:8080 check
