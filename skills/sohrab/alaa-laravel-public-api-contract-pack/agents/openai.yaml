interface:
  display_name: "Laravel Public API Contract Pack"
  short_description: "Source-backed, versioned Laravel API contract packs"
  default_prompt: "Use $alaa-laravel-public-api-contract-pack for source-backed Laravel public API contract packs. Capture `php artisan route:list --json`; compare every artifact against it. Classify changes as additive, breaking, or breaking-for-a-strict-parser; state each write route's retry-safety verdict and each list route's pagination mode and enforced limit. Emit endpoint docs, OpenAPI and SDK notes; invoke $alaa-postman-collections for the required collection and environment from the same verified contract. Write no pack file while any route's API version, deprecation status, or required sunset date is unresolved; report those routes instead. Run `python3 scripts/contract_pack_audit.py` to exit 0. Keep work docs-only unless the user expands scope; separate public input from trusted gateway input. Use `NEEDS_BACKEND_CONFIRMATION` only with evidence the surface exists but its consumer value is unresolved; use `not_implemented` when no route, controller, or passing test exists."

policy:
  allow_implicit_invocation: true
