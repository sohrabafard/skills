interface:
  display_name: "Laravel Public API Contract Pack"
  short_description: "Source-backed Laravel API contract packs"
  default_prompt: "Use $alaa-laravel-public-api-contract-pack to follow its workflow for source-backed Laravel public API contract packs. Build the route inventory, request/response/error/example docs, SDK schema notes, OpenAPI, and Postman artifacts from executable repository truth. Keep the work docs-only unless the user explicitly asks for code changes, separate public client inputs from trusted gateway/backend-only headers, and mark unproven behavior as `NEEDS_BACKEND_CONFIRMATION` or `not_implemented` instead of inventing contracts."

policy:
  allow_implicit_invocation: true
