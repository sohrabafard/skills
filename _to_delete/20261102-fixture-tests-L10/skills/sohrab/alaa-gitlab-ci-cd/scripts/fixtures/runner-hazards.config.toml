# Every runner-side hazard this checker knows about, in one file.
concurrent = 0

[[runners]]
  name = "k8s-privileged"
  url = "https://gitlab.example.com/"
  token = "glrt-REPLACE_WITH_AUTH_TOKEN"
  executor = "kubernetes"

  [runners.kubernetes]
    namespace = "gitlab-runner"
    image = "alpine"
    helper_image = "gitlab/gitlab-runner-helper:latest"
    privileged = true
    pull_policy = ["never"]
    allowed_pull_policies = ["always", "if-not-present"]
    allowed_images = ["docker.io/library/*:*", "*"]
    allowed_services = ["docker:*"]
