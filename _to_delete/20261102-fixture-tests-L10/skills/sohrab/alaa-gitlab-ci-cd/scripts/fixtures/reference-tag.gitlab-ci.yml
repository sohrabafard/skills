# GitLab's !reference tag is valid syntax. This file must parse and stay clean.
.auth:
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

default:
  image: node:24.18.0-alpine3.24
  interruptible: true
  timeout: 20 minutes

stages:
  - test

lint:
  stage: test
  timeout: 10 minutes
  script:
    - !reference [.auth, script]
    - npm run lint
