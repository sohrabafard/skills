# Clean fixture: must validate with exit 0 under --deny-warnings.
data_dir: /var/lib/vector
sources:
  in_files:
    type: file
    include: ["/var/log/app/*.log"]
transforms:
  normalize:
    type: remap
    inputs: [in_files]
    source: |
      .level = downcase(string(.level) ?? "info")
sinks:
  out_console:
    type: console
    inputs: [normalize]
    encoding:
      codec: json
