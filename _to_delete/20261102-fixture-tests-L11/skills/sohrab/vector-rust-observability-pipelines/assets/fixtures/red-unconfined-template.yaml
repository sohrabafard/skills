# RED fixture - must be reported as a finding.
# A routing template with no literal prefix is rejected by Vector 0.57.0.
#
# This fixture is the one that discriminates a correct checker from a plausible
# broken one on 0.57.0: `vector validate --no-environment` reports it CLEAN.
# 0.58.0 catches confinement with either flag set. Keep the strict checker and
# separate disk-bound fixture: one upstream fix does not restore all checks.
data_dir: /var/lib/vector
sources:
  in_files:
    type: file
    include: ["/var/log/app/*.log"]
sinks:
  out_clickhouse:
    type: clickhouse
    inputs: [in_files]
    endpoint: https://clickhouse.example.com:8443
    table: "{{ tenant }}"
