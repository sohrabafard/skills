# Merge deliberately into project .codex/config.toml. Do not overwrite existing config.
# Root/coordinator setting; custom agent files specify their own model and effort.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"
# This cap excludes the primary thread. Start with one heavy local test/build job.
# Permissions, providers, service tiers and MCP servers stay in the parent configuration.
