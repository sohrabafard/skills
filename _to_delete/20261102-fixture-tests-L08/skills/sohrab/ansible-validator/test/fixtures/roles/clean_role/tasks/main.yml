---
- name: Ensure the package is installed
  ansible.builtin.package:
    name: "{{ clean_role_package_name }}"
    state: present
  tags:
    - install

- name: Ensure the configuration directory exists
  ansible.builtin.file:
    path: "{{ clean_role_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - configure
