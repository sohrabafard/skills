---
# Fixture: every secret is correctly indirected. scan_secrets.sh --self-test
# asserts exit 0 here. Before the 2026-07-29 repair this file was reported as
# two secrets and one warning, because the vault filter existed only inside
# check_password_values and not inside the general pattern scan.
- name: Fixture play whose every credential is indirected
  hosts: localhost
  gather_facts: false

  vars:
    db_password: "{{ vault_db_password }}"
    api_token: "{{ lookup('env', 'API_TOKEN') }}"
    admin_password: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/data/app:admin') }}"

  tasks:
    - name: Write the application configuration
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/app/app.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
