---
# Fixture: a playbook that must exit 1 on validate_playbook.sh, scan_secrets.sh,
# check_fqcn.sh and check_task_safety.py. Every defect below is listed in
# expected-findings.md with the checker that reports it. Do not fix this file.
- hosts: all
  become: yes

  vars:
    db_password: "hunter2-plaintext"
    search_term: "{{ user_supplied }}"

  tasks:
    - shell: mkdir -p /opt/app

    - name: install nginx
      apt:
        name: nginx

    - name: Run a status command
      command: systemctl status nginx

    - name: Search the log for a user-supplied term
      shell: "grep {{ search_term }} /var/log/app.log"

    - name: Write a world-writable directory
      file:
        path: /opt/app/incoming
        state: directory
        mode: '0777'

    - name: Copy a secret with a permissive mode
      copy:
        src: app.key
        dest: /etc/app/app.key
        mode: '0666'

    - name: Install packages
      apt:
        name: "{{ item }}"
      with_items:
        - curl
        - vim

    - name: Fetch a release over an unvalidated connection
      get_url:
        url: http://example.com/app.tar.gz
        dest: /tmp/app.tar.gz
        validate_certs: no
      notify: restart nginx service

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted
