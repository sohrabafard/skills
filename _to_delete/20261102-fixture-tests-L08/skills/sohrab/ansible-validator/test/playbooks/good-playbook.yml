---
# Fixture: a playbook that must exit 0 on every checker in this skill.
# Expected findings: none. See expected-findings.md in this directory.
- name: Configure a web server
  hosts: webservers
  become: true
  gather_facts: true

  vars:
    web_package: nginx
    web_service: nginx
    web_config_dir: /etc/nginx

  tasks:
    - name: Ensure the web package is installed
      ansible.builtin.package:
        name: "{{ web_package }}"
        state: present
      tags:
        - install

    - name: Ensure the configuration directory exists
      ansible.builtin.file:
        path: "{{ web_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - configure

    - name: Deploy the web server configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: "{{ web_config_dir }}/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload the web server
      tags:
        - configure

    - name: Record the deployment marker
      ansible.builtin.command: /usr/bin/true
      changed_when: false
      tags:
        - configure

  handlers:
    - name: Reload the web server
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: reloaded
